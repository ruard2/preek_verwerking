<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voorkeuren</title>
<style>
  :root { --groen:#2c5f2d; --rand:#e2e2dd; --tekst:#23231f; --grijs:#6b6b64; --bg:#faf9f5; --kaart:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --groen:#7bb87c; --rand:#33332e; --tekst:#ecebe4; --grijs:#a5a59b; --bg:#17171a; --kaart:#1f1f22; }
  }
  * { box-sizing: border-box; }
  body { font-family: Georgia, serif; max-width: 32rem; margin: 0 auto; padding: 2.5rem 1.25rem;
    background: var(--bg); color: var(--tekst); line-height: 1.6; }
  h1 { font-size: 1.5rem; color: var(--groen); margin: 0 0 1rem; }
  label { display: block; font-size: .8rem; color: var(--grijs); margin: .8rem 0 .15rem;
    text-transform: uppercase; letter-spacing: .05em; font-family: system-ui, sans-serif; }
  input, select { width: 100%; padding: .55rem .7rem; font-size: 1rem; font-family: inherit;
    border: 1px solid var(--rand); border-radius: .45rem; background: var(--kaart); color: var(--tekst); }
  button { margin-top: 1.2rem; padding: .6rem 1.3rem; font-size: 1rem; font-family: inherit;
    border: none; border-radius: .45rem; background: var(--groen); color: #fff; cursor: pointer; }
  button.afmeld { background: none; color: #b0201a; text-decoration: underline; padding: 0; margin-left: 1rem; }
  .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: .7rem; padding: 1.4rem; }
  .melding { padding: .7rem .9rem; border-radius: .45rem; margin-bottom: 1rem; }
  .ok { background: #e9f5ea; color: #1f6b25; } .fout { background: #fdecea; color: #b0201a; }
  @media (prefers-color-scheme: dark) { .ok { background:#1c2a1c; color:#9fd6a3; } .fout { background:#3a1c1a; color:#f0a9a3; } }
</style>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <h1>Je voorkeuren</h1>
  <div id="melding"></div>
  <div id="inhoud"></div>
  <p style="margin-top:2.5rem;font-size:.8rem"><a href="/privacy" style="color:var(--grijs)">Privacyverklaring</a></p>
<script src="/static/ui-i18n.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
const afmeldModus = location.pathname.includes('afmelden');
const meldingEl = document.getElementById('melding');
const inhoud = document.getElementById('inhoud');
const val = id => document.getElementById(id).value.trim();
function toon(soort, tekst) { meldingEl.innerHTML = `<div class="melding ${soort}">${tekst}</div>`; }
async function fouttekst(r) { const d = await r.json().catch(()=>({})); return (typeof d.detail==='string'?d.detail:null) || 'Er ging iets mis.'; }

const DAGEN = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];

if (!token) { toon('fout', 'Geen geldige link.'); }
else {
  fetch('/api/voorkeuren/' + token).then(r => r.ok ? r.json() : Promise.reject())
    .then(bouw).catch(() => toon('fout', 'Deze link is ongeldig of verlopen.'));
}

function bouw(s) {
  AfterSermonI18n.set(s.communicatie_taal || 'auto');
  if (afmeldModus) toon('', '');
  inhoud.innerHTML = `
    <div class="kaart">
      <label>Naam</label><input id="naam" value="${s.naam || ''}">
      <label>Telefoonnummer (optioneel)</label><input id="tel" value="${s.telefoon || ''}">
      <label>Hoe vaak wil je ontvangen?</label>
      <select id="freq">
        <option value="wekelijks">Eén keer per week (hele boekje ineens)</option>
        <option value="dagelijks">Dagelijks (één overdenking per dag)</option>
      </select>
      <div>
        <button id="opslaan">Opslaan</button>
        <button class="afmeld" id="afmeld">Afmelden</button>
      </div>
      <p style="margin-top:1.1rem;font-size:.85rem"><a id="downloaddata" href="#">Download mijn gegevens</a></p>
    </div>`;
  document.getElementById('freq').value = s.frequentie || 'wekelijks';

  const dl = document.getElementById('downloaddata');
  const mijn = {naam: s.naam || '', email: s.email || '', telefoon: s.telefoon || '',
    frequentie: s.frequentie || 'wekelijks'};
  dl.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mijn, null, 2));
  dl.setAttribute('download', 'mijn-gegevens.json');

  document.getElementById('opslaan').onclick = async () => {
    try {
      const r = await fetch('/api/voorkeuren', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({token, naam: val('naam'), telefoon: val('tel'),
          frequentie: val('freq')})
      });
      if (!r.ok) throw new Error(await fouttekst(r));
      toon('ok', 'Je voorkeuren zijn opgeslagen.');
    } catch (f) { toon('fout', f.message); }
  };
  document.getElementById('afmeld').onclick = async () => {
    if (!confirm('Weet je zeker dat je je wilt afmelden? Je ontvangt dan geen overdenkingen meer.')) return;
    try {
      const r = await fetch('/api/afmelden', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({token})
      });
      if (!r.ok) throw new Error(await fouttekst(r));
      inhoud.innerHTML = '';
      toon('ok', 'Je bent afgemeld. Jammer dat je gaat — je kunt je altijd opnieuw aanmelden.');
    } catch (f) { toon('fout', f.message); }
  };
}
</script>
</body>
</html>
