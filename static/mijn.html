<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn AfterSermon</title>
<link rel="stylesheet" href="/static/dashboard.css">
<style>
  /* ── mijn.html-specifiek ─────────────────────────────────── */
  body { max-width: 36rem; margin: 0 auto; }

  /* Verberg de generieke 'AfterSermon' navbar — mijn.html heeft eigen header */
  body::before { display: none; }

  /* ── Eigen header ─────────────────────────────────────────── */
  .paginahoofd {
    position:    fixed;
    left: 0; right: 0; top: 0;
    height:      60px;
    display:     flex;
    align-items: center;
    padding:     0 24px;
    background:  var(--surface);
    border-bottom: 1px solid var(--line);
    z-index:     100;
  }
  .paginahoofd .merk {
    font-family:  var(--font-sans);
    font-weight:  700;
    font-size:    1rem;
    letter-spacing: -.02em;
    color:        var(--brand);
  }
  .paginahoofd .admin-link {
    margin-left:     auto;
    font-size:       .8rem;
    color:           var(--muted);
    text-decoration: none;
  }
  .paginahoofd .admin-link:hover { color: var(--brand); }

  /* ── Welkomkop (uitgelogd) ────────────────────────────────── */
  .portaal-kop {
    text-align:  center;
    padding:     2rem 0 1rem;
    margin-bottom: 1rem;
  }
  .portaal-kop h1 {
    font-size:    2rem;
    margin-bottom: .3rem;
    color:        var(--ink);
  }
  .portaal-kop .sub { font-size: .97rem; color: var(--muted); margin: 0; }

  /* ── Tabs ─────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 0; margin-bottom: -1px; }
  .tab {
    padding:       .6rem 1.2rem;
    font-size:     .9rem;
    font-family:   var(--font-sans);
    cursor:        pointer;
    border:        1px solid var(--line);
    background:    var(--bg);
    border-radius: 10px 10px 0 0;
    color:         var(--muted);
    border-bottom: none;
    transition:    color .12s;
  }
  .tab.actief { background: var(--surface); color: var(--ink); font-weight: 600; }
  .tab-inhoud         { display: none; }
  .tab-inhoud.actief  { display: block; }
  .tab-kaart { border-radius: 0 10px 10px 10px; }

  /* ── Uitvoer keuze-blokken ────────────────────────────────── */
  .uitvoer-groep { display: flex; flex-direction: column; gap: .45rem; margin: .4rem 0 .6rem; }
  .uitvoer-blok {
    border:        1.5px solid var(--line);
    border-radius: 10px;
    padding:       .75rem 1rem;
    cursor:        pointer;
    transition:    border-color .15s, background .15s;
  }
  .uitvoer-blok:has(.uitvoer-chk:checked) {
    border-color: var(--brand);
    background:   var(--brand-soft);
  }
  .uitvoer-optie {
    display:        flex;
    align-items:    flex-start;
    gap:            .6rem;
    margin:         0;
    cursor:         pointer;
    text-transform: none;
    letter-spacing: normal;
    font-size:      .95rem;
    color:          var(--ink);
  }
  .uitvoer-optie input {
    width:          auto;
    flex:           none;
    margin-top:     .2rem;
    accent-color:   var(--brand);
    border:         none;
    padding:        0;
    box-shadow:     none;
  }
  .uitvoer-naam  { display: block; font-weight: 600; font-size: .95rem; }
  .uitvoer-omschr { display: block; font-size: .8rem; color: var(--muted); margin-top: .1rem; line-height: 1.4; }

  /* ── Portaal kaarten ──────────────────────────────────────── */
  .portaal-kaart { margin-bottom: 12px; }
  .portaal-kaart strong { font-size: .95rem; }
  .portaal-kaart p.toelichting { margin: .4rem 0 .6rem; font-size: .9rem; color: var(--muted); }

  /* ── Uitlogknop ───────────────────────────────────────────── */
  .uitlogknop {
    background:      none;
    color:           var(--muted);
    border:          none;
    box-shadow:      none;
    padding:         0;
    font-size:       .88rem;
    text-decoration: underline;
    margin:          1rem 0 0;
    cursor:          pointer;
  }
  .uitlogknop:hover { color: var(--ink); background: none; }

  /* ── Privacylink ──────────────────────────────────────────── */
  .privacy {
    margin-top: 2.5rem;
    font-size:  .8rem;
    text-align: center;
  }
  .privacy a { color: var(--muted); text-decoration: none; }
  .privacy a:hover { color: var(--brand); }
</style>
<script src="/static/talen.js"></script>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c5e39">
</head>
<body>

<header class="paginahoofd">
  <span class="merk">AfterSermon</span>
  <a href="/admin" class="admin-link">Beheerder →</a>
</header>

<div id="melding"></div>
<div id="inhoud"></div>

<p class="privacy"><a href="/privacy">Privacyverklaring</a></p>

<script>
const meldingEl = document.getElementById('melding');
const inhoud    = document.getElementById('inhoud');
const params    = new URLSearchParams(location.search);

function toon(soort, tekst) {
  meldingEl.innerHTML = `<div class="melding ${soort}">${tekst}</div>`;
}

async function api(methode, pad, data) {
  const r = await fetch(pad, {
    method: methode,
    headers: data ? {'Content-Type':'application/json'} : undefined,
    body: data ? JSON.stringify(data) : undefined,
  });
  const json = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(json.detail || 'Er ging iets mis.');
  return json;
}

const UITVOER_LABEL = {
  dagstukjes:        'Dagstukjes',
  preeksamenvatting: 'Samenvatting',
  nabespreking:      'Vragen voor groepen',
  preektranscript:   'Preektekst',
};
const UITVOER_OMSCHR = {
  dagstukjes:        'Zeven korte overdenkingen — één per dag, met Bijbeltekst en vragen.',
  preeksamenvatting: 'Samenvatting van 400–600 woorden met de lijn en boodschap van de preek.',
  nabespreking:      'Vragen om als huisgroep of gezin de preek verder te bespreken.',
  preektranscript:   'De volledige, opgeschoonde preektekst om rustig na te lezen.',
};
const ALLE_TYPEN = Object.keys(UITVOER_LABEL);

// ── Hoofdlogica ──────────────────────────────────────────────────────────────

async function init() {
  const resetToken  = params.get('reset_token');
  if (resetToken)  { bouwReset(resetToken);              return; }
  const instelToken = params.get('instel_token');
  if (instelToken) { bouwWachtwoordInstellen(instelToken); return; }

  try {
    const mij = await api('GET', '/api/gebruiker/mij');
    bouwPortaal(mij);
  } catch {
    bouwInloggen();
  }
}

// ── Inlogscherm ──────────────────────────────────────────────────────────────

function bouwInloggen() {
  inhoud.innerHTML = `
    <div class="portaal-kop">
      <h1>Welkom terug</h1>
      <p class="sub">Log in om je overdenkingen te ontvangen en je voorkeuren aan te passen.</p>
    </div>
    <div class="tabs">
      <div class="tab actief" onclick="wisselTab('inlog',this)">Inloggen</div>
      <div class="tab"       onclick="wisselTab('reset',this)">Wachtwoord vergeten</div>
    </div>
    <div class="kaart tab-kaart">
      <div class="tab-inhoud actief" id="tab-inlog">
        <label for="il-email">E-mailadres</label>
        <input id="il-email" type="email" autocomplete="email" placeholder="naam@voorbeeld.nl">
        <label for="il-ww">Wachtwoord</label>
        <input id="il-ww" type="password" autocomplete="current-password">
        <button id="il-knop" onclick="doInloggen()">Inloggen →</button>
        <p style="margin:.9rem 0 0;font-size:.88rem;color:var(--muted)">
          Nog geen account? Je ontvangt een aanmeldlink van je kerk.
          Heb je die nooit gezien? <a href="#" onclick="wisselTabNaam('reset');return false">Vraag wachtwoord-herstel aan</a>.
        </p>
      </div>
      <div class="tab-inhoud" id="tab-reset">
        <p style="margin:0 0 .6rem;font-size:.9rem;color:var(--muted)">
          Vul je e-mailadres in. Je ontvangt een herstellink als je account bestaat.
        </p>
        <label for="rs-email">E-mailadres</label>
        <input id="rs-email" type="email" placeholder="naam@voorbeeld.nl">
        <button id="rs-knop" onclick="doReset()">Herstelmail sturen →</button>
      </div>
    </div>
  `;
  document.getElementById('il-ww')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') doInloggen();
  });
}

function wisselTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('actief'));
  document.querySelectorAll('.tab-inhoud').forEach(t => t.classList.remove('actief'));
  el?.classList.add('actief');
  document.getElementById('tab-' + id)?.classList.add('actief');
}
function wisselTabNaam(id) {
  const tabs = document.querySelectorAll('.tab');
  const idx  = id === 'reset' ? 1 : 0;
  tabs.forEach((t, i) => {
    t.classList.toggle('actief', i === idx);
    document.querySelectorAll('.tab-inhoud')[i]?.classList.toggle('actief', i === idx);
  });
}

async function doInloggen() {
  const knop  = document.getElementById('il-knop');
  const email = document.getElementById('il-email')?.value.trim();
  const ww    = document.getElementById('il-ww')?.value;
  if (!email || !ww) { toon('fout', 'Vul e-mailadres en wachtwoord in.'); return; }
  knop.disabled = true; knop.textContent = 'Bezig…';
  try {
    await api('POST', '/api/gebruiker/inloggen', {email, wachtwoord: ww});
    meldingEl.innerHTML = '';
    const mij = await api('GET', '/api/gebruiker/mij');
    bouwPortaal(mij);
  } catch (e) {
    toon('fout', e.message);
    knop.disabled = false; knop.textContent = 'Inloggen →';
  }
}

async function doReset() {
  const knop  = document.getElementById('rs-knop');
  const email = document.getElementById('rs-email')?.value.trim();
  if (!email) { toon('fout', 'Vul je e-mailadres in.'); return; }
  knop.disabled = true; knop.textContent = 'Verzenden…';
  try {
    await api('POST', '/api/gebruiker/wachtwoord-reset-aanvragen', {email});
    toon('ok', 'Als je e-mailadres bekend is, ontvang je een herstellink. Controleer ook je spam-map.');
    knop.textContent = 'Verstuurd ✓';
  } catch (e) {
    toon('fout', e.message);
    knop.disabled = false; knop.textContent = 'Herstelmail sturen →';
  }
}

// ── Wachtwoord instellen / resetten ─────────────────────────────────────────

function bouwWachtwoordInstellen(token) {
  inhoud.innerHTML = `
    <h1>Wachtwoord instellen</h1>
    <p class="sub">Kies een wachtwoord om voortaan makkelijk in te loggen.</p>
    <div class="kaart">
      <label for="wi-ww">Nieuw wachtwoord</label>
      <input id="wi-ww" type="password" autocomplete="new-password" placeholder="Minimaal 8 tekens">
      <label for="wi-ww2">Herhaal wachtwoord</label>
      <input id="wi-ww2" type="password" autocomplete="new-password">
      <button onclick="doWachtwoordViaToken('${token}')">Opslaan en inloggen →</button>
    </div>
  `;
}

async function doWachtwoordViaToken(token) {
  const ww  = document.getElementById('wi-ww')?.value;
  const ww2 = document.getElementById('wi-ww2')?.value;
  if (!ww || !ww2) { toon('fout', 'Vul beide velden in.'); return; }
  try {
    await api('POST', '/api/gebruiker/wachtwoord-instellen-via-token?token=' + encodeURIComponent(token),
      {wachtwoord: ww, bevestig: ww2});
    meldingEl.innerHTML = '';
    const mij = await api('GET', '/api/gebruiker/mij');
    toon('ok', 'Wachtwoord opgeslagen. Je bent nu ingelogd.');
    bouwPortaal(mij);
  } catch (e) { toon('fout', e.message); }
}

function bouwReset(token) {
  inhoud.innerHTML = `
    <h1>Nieuw wachtwoord</h1>
    <p class="sub">Kies een nieuw wachtwoord voor je AfterSermon-account.</p>
    <div class="kaart">
      <label for="nr-ww">Nieuw wachtwoord</label>
      <input id="nr-ww" type="password" autocomplete="new-password" placeholder="Minimaal 8 tekens">
      <label for="nr-ww2">Herhaal wachtwoord</label>
      <input id="nr-ww2" type="password" autocomplete="new-password">
      <button onclick="doNieuwWachtwoord('${token}')">Opslaan en inloggen →</button>
    </div>
  `;
}

async function doNieuwWachtwoord(token) {
  const ww  = document.getElementById('nr-ww')?.value;
  const ww2 = document.getElementById('nr-ww2')?.value;
  if (!ww || !ww2) { toon('fout', 'Vul beide velden in.'); return; }
  try {
    await api('POST', '/api/gebruiker/wachtwoord-reset', {token, wachtwoord: ww, bevestig: ww2});
    meldingEl.innerHTML = '';
    const mij = await api('GET', '/api/gebruiker/mij');
    toon('ok', 'Wachtwoord gewijzigd. Je bent ingelogd.');
    bouwPortaal(mij);
  } catch (e) { toon('fout', e.message); }
}

// ── Portaal (ingelogd) ───────────────────────────────────────────────────────

function bouwPortaal(mij) {
  const beschikbaar = (mij.uitvoer_beschikbaar?.length ? mij.uitvoer_beschikbaar : ALLE_TYPEN);
  const gekozen     = mij.uitvoer_voorkeur?.length ? mij.uitvoer_voorkeur : beschikbaar;

  if (mij.accentkleur)
    document.documentElement.style.setProperty('--brand', mij.accentkleur);

  const uitvoerRijen = beschikbaar.map(x => {
    const isGekozen = gekozen.includes(x);
    return `
      <div class="uitvoer-blok">
        <label class="uitvoer-optie">
          <input type="checkbox" class="uitvoer-chk" value="${x}" ${isGekozen ? 'checked' : ''}>
          <span>
            <span class="uitvoer-naam">${UITVOER_LABEL[x] || x}</span>
            <span class="uitvoer-omschr">${UITVOER_OMSCHR[x] || ''}</span>
          </span>
        </label>
      </div>`;
  }).join('');

  inhoud.innerHTML = `
    <h1>Hoi${mij.naam ? ', ' + mij.naam.split(' ')[0] : ''}!</h1>
    <p class="sub" style="margin-bottom:1.4rem">
      Je overdenkingen komen van <strong style="color:var(--brand)">${mij.kerk_naam || 'je kerk'}</strong>.
    </p>

    <div class="kaart portaal-kaart">
      <strong>Wat wil je ontvangen?</strong>
      <div class="uitvoer-groep" style="margin-top:.7rem">${uitvoerRijen}</div>

      <hr style="border:none;border-top:1px solid var(--line);margin:1.1rem 0">

      <label for="freq">Hoe vaak?</label>
      <select id="freq">
        <option value="wekelijks">Wekelijks — alles ineens op één dag</option>
        <option value="dagelijks">Dagelijks — één overdenking per dag</option>
      </select>

      <label for="dienst">Welke dienst(en)?</label>
      <select id="dienst">
        <option value="beide">Beide diensten</option>
        <option value="ochtend">Alleen de ochtenddienst</option>
        <option value="avond">Alleen de avonddienst</option>
      </select>

      <label for="uitvoer-taal">Taal van de overdenkingen</label>
      <div id="uitvoer-taal-wrap"></div>
      <p style="font-size:.78rem;color:var(--muted);margin:.2rem 0 0">
        "Zelfde als de preek" is de aanbevolen instelling — de AI schrijft dan automatisch in de taal van de dienst.
      </p>

      <button id="opslaan-knop" onclick="doOpslaanVoorkeuren()">Voorkeuren opslaan →</button>
    </div>

    <div class="kaart portaal-kaart">
      <strong>Wachtwoord</strong>
      <p class="toelichting">
        ${mij.heeft_wachtwoord
          ? 'Je hebt een wachtwoord ingesteld. Je kunt het hieronder wijzigen.'
          : 'Stel een wachtwoord in zodat je makkelijk kunt inloggen.'}
      </p>
      <label for="ww-nieuw">Nieuw wachtwoord</label>
      <input id="ww-nieuw" type="password" autocomplete="new-password" placeholder="Minimaal 8 tekens">
      <label for="ww-bevestig">Herhaal</label>
      <input id="ww-bevestig" type="password" autocomplete="new-password">
      <button style="padding:.5rem 1rem;font-size:.9rem" onclick="doWijzigWachtwoord()">Wachtwoord opslaan</button>
    </div>

    <div style="text-align:right;padding:.3rem 0 1rem">
      <button class="uitlogknop" onclick="doUitloggen()">Uitloggen</button>
    </div>
  `;

  document.getElementById('freq').value   = mij.frequentie    || 'wekelijks';
  document.getElementById('dienst').value = mij.dienstvoorkeur || 'beide';

  // Taalveld inladen
  const taalWrap = document.getElementById('uitvoer-taal-wrap');
  if (taalWrap && window.maakTaalSelect) {
    const sel = maakTaalSelect('uitvoer-taal', mij.uitvoer_taal || '');
    taalWrap.appendChild(sel);
  }
}

async function doOpslaanVoorkeuren() {
  const knop   = document.getElementById('opslaan-knop');
  const gekozen = [...document.querySelectorAll('.uitvoer-chk:checked')].map(c => c.value);
  if (!gekozen.length) { toon('fout', 'Kies minimaal één onderdeel.'); return; }
  knop.disabled = true; knop.textContent = 'Opslaan…';
  try {
    const mij = await api('GET', '/api/gebruiker/mij');
    await api('POST', '/api/voorkeuren', {
      token:            mij.voorkeur_token,
      frequentie:       document.getElementById('freq').value,
      dienstvoorkeur:   document.getElementById('dienst').value,
      uitvoer_voorkeur: gekozen,
      uitvoer_taal:     document.getElementById('uitvoer-taal')?.value || '',
    });
    toon('ok', 'Opgeslagen! Je ontvangt je overdenkingen ' +
      (document.getElementById('freq').value === 'dagelijks' ? 'dagelijks' : 'wekelijks') +
      ' zodra ze klaar zijn. Een kleine vertraging kan optreden als je kerk de inhoud eerst wil goedkeuren.');
    knop.textContent = 'Voorkeuren opslaan →';
    knop.disabled = false;
  } catch (e) {
    toon('fout', e.message);
    knop.disabled = false; knop.textContent = 'Voorkeuren opslaan →';
  }
}

async function doWijzigWachtwoord() {
  const ww  = document.getElementById('ww-nieuw')?.value;
  const ww2 = document.getElementById('ww-bevestig')?.value;
  if (!ww) { toon('fout', 'Vul een wachtwoord in.'); return; }
  try {
    await api('POST', '/api/gebruiker/wachtwoord-instellen', {wachtwoord: ww, bevestig: ww2});
    toon('ok', 'Wachtwoord opgeslagen.');
    document.getElementById('ww-nieuw').value    = '';
    document.getElementById('ww-bevestig').value = '';
  } catch (e) { toon('fout', e.message); }
}

async function doUitloggen() {
  await api('POST', '/api/gebruiker/uitloggen');
  meldingEl.innerHTML = '';
  bouwInloggen();
}

init();
</script>
</body>
</html>
