<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfterSermon — Instellen</title>
<link rel="stylesheet" href="/static/dashboard.css">
<style>
/* ===== Wizard ===== */
.wizard { max-width: 700px; margin: 0 auto; }

.stap {
  border: 1px solid var(--line); border-radius: 14px;
  margin-bottom: 10px; background: var(--surface);
  box-shadow: 0 2px 8px rgba(16,42,42,.04);
  overflow: hidden;
}
.stap-kop {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 22px; user-select: none;
}
.stap.bereikbaar .stap-kop { cursor: pointer; }
.stap-nr {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--soft); color: var(--brand);
  display: grid; place-items: center;
  font-weight: 800; font-size: .88rem; flex: none;
  transition: background .15s, color .15s;
}
.stap.open .stap-nr,
.stap.klaar .stap-nr { background: var(--brand); color: #fff; }
.stap-titelrij { flex: 1; display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.stap-titel { font-weight: 700; font-size: 1rem; color: var(--ink); }
.stap-vinkje { color: var(--brand); }
.stap-sam { color: var(--muted); font-size: .83rem; margin-left: auto; white-space: nowrap; }
.stap-body { display: none; padding: 4px 22px 22px; border-top: 1px solid var(--line); }
.stap.open .stap-body { display: block; }

/* ===== Section labels ===== */
.sectie-label {
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--brand); font-size: .7rem; font-weight: 800;
  margin: 24px 0 8px; font-family: Inter, sans-serif;
  display: flex; align-items: center; gap: 6px;
}
.sectie-label:first-child { margin-top: 10px; }
.sectie-label .ico { font-size: 1rem; text-transform: none; letter-spacing: 0; }
.info-tekst { color: var(--muted); font-size: .88rem; margin: 4px 0 12px; line-height: 1.55; }
.info-tekst a { color: var(--brand); }

/* ===== Aanbevolen badge ===== */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .72rem; font-weight: 700; border-radius: 99px;
  padding: 2px 9px; text-transform: uppercase; letter-spacing: .06em;
  vertical-align: middle; margin-left: 6px;
}
.badge-groen { background: var(--soft); color: var(--brand); }
.badge-grijs  { background: var(--bg);   color: var(--muted); border: 1px solid var(--line); }

/* ===== Service time rows ===== */
.dienst-rij {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--bg); border-radius: 9px;
  margin-bottom: 7px; border: 1px solid var(--line);
}
.dienst-rij select, .dienst-rij input[type=time] { flex: 1; margin: 0; }
.dienst-rij .del-knop {
  flex: none; background: none !important; border: none !important; box-shadow: none !important;
  color: var(--muted); font-size: 1.1rem; padding: 4px 6px !important;
  cursor: pointer; line-height: 1; border-radius: 5px; min-width: 0 !important;
}
.dienst-rij .del-knop:hover { color: #c0392b; background: #fdecea !important; }
.link-knop {
  background: none !important; border: none !important; box-shadow: none !important;
  color: var(--brand); font-size: .84rem; padding: 0 !important;
  cursor: pointer; font-weight: 600; text-decoration: underline; margin: 0;
}

/* ===== Controle detail (collapsible) ===== */
.controle-detail {
  margin-top: 10px;
  border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; background: var(--bg);
}
.controle-detail .sectie-label { margin-top: 12px; }
.controle-detail .sectie-label:first-child { margin-top: 0; }

/* ===== Radio options ===== */
.radio-groep { display: flex; flex-direction: column; gap: 7px; margin: 8px 0 12px; }
.radio-optie {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--line);
  cursor: pointer; transition: border-color .15s, background .15s;
}
.radio-optie:hover { border-color: var(--brand); }
.radio-optie.gekozen { border-color: var(--brand); background: var(--soft); }
.radio-optie input[type=radio] { flex: none; margin-top: 3px; accent-color: var(--brand); }
.radio-optie .ro-inhoud { flex: 1; }
.radio-optie .ro-titel { font-weight: 600; font-size: .88rem; margin: 0 0 1px; color: var(--ink); }
.radio-optie .ro-omschr { font-size: .80rem; color: var(--muted); margin: 0; line-height: 1.45; }

/* ===== Toggle ===== */
.toggle-rij { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.toggle-rij input[type=checkbox] {
  appearance: none; -webkit-appearance: none;
  width: 44px !important; height: 24px;
  border-radius: 99px !important; background: #cdd8d2 !important;
  border: 0 !important; position: relative; transition: .2s; flex: none; cursor: pointer;
}
.toggle-rij input[type=checkbox]:before {
  content: ""; position: absolute; width: 18px; height: 18px;
  left: 3px; top: 3px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 4px #0003; transition: .2s;
}
.toggle-rij input[type=checkbox]:checked { background: var(--brand) !important; }
.toggle-rij input[type=checkbox]:checked:before { transform: translateX(20px); }
.toggle-rij label {
  margin: 0 !important; font-size: .88rem !important;
  color: var(--ink) !important; font-weight: 500 !important;
  text-transform: none !important; letter-spacing: 0 !important; cursor: pointer;
}

/* ===== QR / share ===== */
.qr-sectie { display: flex; gap: 16px; align-items: flex-start; margin: 10px 0 12px; }
.qr-sectie img { width: 96px; flex: none; border-radius: 8px; border: 1px solid var(--line); }
.qr-sectie .qr-rechts { flex: 1; }
.qr-sectie .qr-rechts input { width: 100%; margin-bottom: 6px; font-size: .82rem; }

/* ===== Color picker ===== */
.kleur-rij { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.kleur-rij input[type=color] {
  width: 48px !important; height: 40px; border-radius: 8px !important;
  border: 1px solid var(--line) !important; padding: 3px !important;
  cursor: pointer; background: none !important; flex: none;
}
.kleur-rij input[type=text] { flex: 1; margin: 0; font-size: .88rem; }
.kleur-preview {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line);
  flex: none; transition: background .15s;
}

/* ===== Logo upload ===== */
.logo-zone {
  border: 2px dashed var(--line); border-radius: 10px;
  padding: 18px 16px; text-align: center; cursor: pointer;
  transition: border-color .15s, background .15s; margin: 8px 0 10px;
}
.logo-zone:hover { border-color: var(--brand); background: var(--soft); }
.logo-zone input { display: none; }
.logo-zone .logo-tekst { font-size: .85rem; color: var(--muted); }
.logo-zone .logo-tekst b { display: block; color: var(--brand); margin-bottom: 4px; font-size: .92rem; }
.logo-preview { max-height: 60px; max-width: 200px; margin: 8px auto 0; display: block; border-radius: 5px; }

/* ===== Textarea ===== */
.disclaimer-area {
  width: 100%; min-height: 100px; font-size: .84rem;
  line-height: 1.55; resize: vertical; font-family: inherit;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink);
  margin: 4px 0 6px;
}

/* ===== Nav buttons ===== */
.nav-rij { display: flex; gap: 8px; margin-top: 22px; }
.nav-rij button { flex: 1; }
.nav-rij .btn-terug {
  background: transparent !important; border: 1px solid var(--line) !important;
  color: var(--ink) !important; box-shadow: none !important;
}
.nav-rij .btn-terug:hover { background: var(--bg) !important; }

/* ===== Finish block ===== */
.finish-blok { text-align: center; padding: 24px 20px; }
.finish-blok .finish-icon { font-size: 2.4rem; margin-bottom: 10px; }
.finish-blok p { color: var(--muted); margin: 0 0 16px; font-size: .92rem; }
</style>
</head>
<body>
  <h1>AfterSermon</h1>
  <p class="sub">Koppel je kanaal en stel de automatisering in — in twee stappen klaar.</p>

  <div class="wizard" id="wizard"></div>

<script src="/static/ui-i18n.js"></script>
<script>
// ===================================================
// Constanten
// ===================================================
const STANDAARD_DISCLAIMER =
  'Dit bericht is samengesteld met behulp van kunstmatige intelligentie. ' +
  'De AI werkt uitsluitend met de inhoud van de preek en houdt zich aan strikte ' +
  'richtlijnen. Toch kan AI fouten maken — bij vragen over de inhoud is de voorganger ' +
  'de betrouwbare bron. Opmerkingen of feedback? Mail naar info@aftersermon.nl';

const DAG_NAMEN = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];

// ===================================================
// State
// ===================================================
const state = {
  kanaalUrl:               '',
  diensten:                [{ dag: 6, tijd: '10:00' }],   // Zondag 10:00 als standaard
  controleVoorVerzending:  false,
  controleEmails:          '',
  alsNietGecheckt:         'versturen',                    // 'versturen' | 'blokkeren'
  waarschuwingstekst:      STANDAARD_DISCLAIMER,
  accentkleur:             '',
  logoBestand:             null,
  inschrijvingOpen:        true,
  actieveStap:             1,
};

// ===================================================
// Wizard helpers
// ===================================================
function stapKlaar(n) {
  if (n === 1) return !!state.kanaalUrl;
  if (n === 2) return stapKlaar(1);
  return false;
}
function stapBereikbaar(n) {
  if (n === 1) return true;
  return stapKlaar(n - 1);
}

function openStap(n) {
  if (!stapBereikbaar(n)) return;
  state.actieveStap = n;
  renderWizard();
  document.getElementById('wizard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderWizard() {
  const w = document.getElementById('wizard');
  w.innerHTML = '';
  [1, 2].forEach(n => w.appendChild(buildStap(n)));
}

function buildStap(n) {
  const open       = state.actieveStap === n;
  const klaar      = stapKlaar(n);
  const bereikbaar = stapBereikbaar(n);

  const d = document.createElement('div');
  d.className = 'stap' +
    (open       ? ' open'       : '') +
    (klaar      ? ' klaar'      : '') +
    (bereikbaar ? ' bereikbaar' : '');

  // Header
  const kop = document.createElement('div');
  kop.className = 'stap-kop';
  if (bereikbaar && !open) kop.addEventListener('click', () => openStap(n));

  const nr = document.createElement('div');
  nr.className = 'stap-nr';
  nr.textContent = klaar && !open ? '✓' : n;
  kop.appendChild(nr);

  const titelrij = document.createElement('div');
  titelrij.className = 'stap-titelrij';
  const titel = document.createElement('span');
  titel.className = 'stap-titel';
  titel.textContent = stapTitel(n);
  titelrij.appendChild(titel);
  kop.appendChild(titelrij);

  const sam = stapSamenvatting(n);
  if (sam && !open) {
    const s = document.createElement('span');
    s.className = 'stap-sam';
    s.textContent = sam;
    kop.appendChild(s);
  }
  d.appendChild(kop);

  if (open) {
    const body = document.createElement('div');
    body.className = 'stap-body';
    n === 1 ? buildStap1(body) : buildStap2(body);
    d.appendChild(body);
  }
  return d;
}

function stapTitel(n) {
  return ['', 'Koppel je kanaal', 'Automatiseer het proces'][n];
}

function stapSamenvatting(n) {
  if (n === 1 && state.kanaalUrl) return kortLabel(state.kanaalUrl);
  return '';
}

function kortLabel(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('kerkdienstgemist')) return 'Kerkdienstgemist';
    const m = u.pathname.match(/@[\w.-]+/);
    return 'YouTube ' + (m ? m[0] : u.hostname);
  } catch { return url.slice(0, 30); }
}

// ===================================================
// Stap 1 — Kanaal koppelen
// ===================================================
function buildStap1(body) {
  addTekst(body, 'info-tekst',
    'Plak de link van je YouTube-kanaal of Kerkdienstgemist-station. ' +
    'AfterSermon haalt nieuwe preken daarna automatisch op.');

  const inp = document.createElement('input');
  inp.type = 'url'; inp.id = 'kanaal-url';
  inp.placeholder = 'https://youtube.com/@mijnkerk  ·  https://kerkdienstgemist.nl/stations/…';
  inp.value = state.kanaalUrl;
  inp.style.cssText = 'width:100%;margin-bottom:12px';
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') laadKanaal(); });
  body.appendChild(inp);

  const btn = document.createElement('button');
  btn.id = 'kanaal-knop'; btn.textContent = 'Verbinden →';
  btn.addEventListener('click', laadKanaal);
  body.appendChild(btn);

  if (state.kanaalUrl) {
    const ok = document.createElement('p');
    ok.className = 'info-tekst'; ok.style.color = 'var(--brand)';
    ok.textContent = '✓ Kanaal verbonden.';
    body.appendChild(ok);
    body.appendChild(buildNav(null, () => openStap(2)));
  }
}

async function laadKanaal() {
  const url = (document.getElementById('kanaal-url')?.value || '').trim();
  if (!url) return;
  const knop = document.getElementById('kanaal-knop');
  if (knop) { knop.disabled = true; knop.textContent = 'Laden…'; }
  try {
    const r = await fetch('/api/kanaal?' + new URLSearchParams({ url }));
    if (!r.ok) throw new Error('Kanaal kon niet worden geladen.');
    const data = await r.json();
    state.kanaalUrl = data.kanaal || url;
    openStap(2);
  } catch (e) {
    alert(e.message);
    if (knop) { knop.disabled = false; knop.textContent = 'Verbinden →'; }
  }
}

// ===================================================
// Stap 2 — Automatiseer het proces (5 secties)
// ===================================================
function buildStap2(body) {

  // ── 1. DIENST-TIJDEN ─────────────────────────────
  addLabel(body, '🕐 Wanneer zijn je diensten?');
  addTekst(body, 'info-tekst',
    'AfterSermon wacht na elke dienst op het transcript en verwerkt daarna automatisch. ' +
    'Heb je meerdere diensten per week? Voeg ze allemaal toe.');

  const dienstenContainer = document.createElement('div');
  dienstenContainer.id = 'diensten-container';
  body.appendChild(dienstenContainer);
  renderDiensten(dienstenContainer);

  const toevoegKnop = document.createElement('button');
  toevoegKnop.className = 'link-knop';
  toevoegKnop.textContent = '+ Dienst toevoegen';
  toevoegKnop.style.marginBottom = '4px';
  toevoegKnop.addEventListener('click', () => {
    state.diensten.push({ dag: 6, tijd: '10:00' });
    renderDiensten(dienstenContainer);
  });
  body.appendChild(toevoegKnop);

  // ── 2. CONTROLE VOOR VERZENDING ───────────────────
  addLabel(body, '✅ Controle voor verzending');

  // Recommendation card
  const rekContainer = document.createElement('div');
  rekContainer.className = 'radio-groep';

  const optAuto = maakRadioOptie(
    'controle-keuze', 'direct',
    !state.controleVoorVerzending,
    'Direct versturen',
    'Zodra AfterSermon klaar is, gaat alles meteen de deur uit. Geen tussenstap. ' +
    'Dit bespaart tijd en zorgt voor de meeste regelmaat.',
    '<span class="badge badge-groen">Aanbevolen</span>'
  );
  optAuto.addEventListener('click', () => {
    state.controleVoorVerzending = false;
    herarrangeerControle(body);
  });

  const optCheck = maakRadioOptie(
    'controle-keuze', 'check',
    state.controleVoorVerzending,
    'Eerst controleren',
    'Na de dienst ontvangen jullie een link om de samenvatting, overdenkingen en vragen ' +
    'te bekijken en eventueel aan te passen. Pas daarna gaat het naar de verzendlijst.',
    ''
  );
  optCheck.addEventListener('click', () => {
    state.controleVoorVerzending = true;
    herarrangeerControle(body);
  });

  rekContainer.appendChild(optAuto);
  rekContainer.appendChild(optCheck);
  body.appendChild(rekContainer);

  // Detail (alleen zichtbaar bij controle=true)
  const controleDetail = document.createElement('div');
  controleDetail.id = 'controle-detail';
  controleDetail.className = 'controle-detail';
  controleDetail.style.display = state.controleVoorVerzending ? 'block' : 'none';
  bouwControleDetail(controleDetail);
  body.appendChild(controleDetail);

  // ── 3. AI-DISCLAIMER ──────────────────────────────
  addLabel(body, '🛡️ AI-disclaimertekst');
  addTekst(body, 'info-tekst',
    'Deze tekst staat onderaan elk bericht dat AfterSermon verstuurt. ' +
    'Je kunt hem aanpassen aan de tone-of-voice van je kerk.');

  const discArea = document.createElement('textarea');
  discArea.id = 'disclaimer-area';
  discArea.className = 'disclaimer-area';
  discArea.value = state.waarschuwingstekst;
  discArea.rows = 5;
  discArea.addEventListener('input', () => { state.waarschuwingstekst = discArea.value; });
  body.appendChild(discArea);

  const resetDisc = document.createElement('button');
  resetDisc.className = 'link-knop';
  resetDisc.textContent = 'Standaardtekst herstellen';
  resetDisc.style.marginBottom = '4px';
  resetDisc.addEventListener('click', () => {
    state.waarschuwingstekst = STANDAARD_DISCLAIMER;
    discArea.value = STANDAARD_DISCLAIMER;
  });
  body.appendChild(resetDisc);

  // ── 4. UITSTRALING ────────────────────────────────
  addLabel(body, '🎨 Uitstraling');
  addTekst(body, 'info-tekst',
    'Je logo en kleur verschijnen op de aanmeldpagina en in de mails die AfterSermon verstuurt.');

  // Logo upload
  const logoZone = document.createElement('div');
  logoZone.className = 'logo-zone';
  const logoInp = document.createElement('input');
  logoInp.type = 'file'; logoInp.accept = 'image/*'; logoInp.id = 'logo-input';
  const logoTekst = document.createElement('div');
  logoTekst.className = 'logo-tekst';
  logoTekst.innerHTML = '<b>📎 Logo uploaden</b>PNG, JPG of SVG · max 2 MB';
  const logoImg = document.createElement('img');
  logoImg.className = 'logo-preview'; logoImg.id = 'logo-preview';
  logoImg.style.display = 'none';
  logoZone.appendChild(logoInp);
  logoZone.appendChild(logoTekst);
  logoZone.appendChild(logoImg);
  logoZone.addEventListener('click', () => logoInp.click());
  logoInp.addEventListener('change', () => {
    const f = logoInp.files[0];
    if (!f) return;
    state.logoBestand = f;
    const reader = new FileReader();
    reader.onload = e => {
      logoImg.src = e.target.result;
      logoImg.style.display = 'block';
      logoTekst.innerHTML = `<b>✓ ${f.name}</b>Klik om te vervangen`;
    };
    reader.readAsDataURL(f);
  });
  // Laad bestaand logo als dat er is
  const bestaandLogo = new Image();
  bestaandLogo.src = '/logo/' + (window._kerkId || '');
  bestaandLogo.onload = () => {
    logoImg.src = bestaandLogo.src;
    logoImg.style.display = 'block';
    logoTekst.innerHTML = '<b>✓ Huidig logo</b>Klik om te vervangen';
  };
  body.appendChild(logoZone);

  // Accentkleur
  const kleurLabel = document.createElement('div');
  kleurLabel.className = 'sectie-label';
  kleurLabel.style.marginTop = '12px';
  kleurLabel.textContent = 'Accentkleur';
  body.appendChild(kleurLabel);

  const kleurRij = document.createElement('div');
  kleurRij.className = 'kleur-rij';
  const kleurPicker = document.createElement('input');
  kleurPicker.type = 'color';
  kleurPicker.id = 'kleur-picker';
  kleurPicker.value = state.accentkleur || '#167455';
  const kleurTxt = document.createElement('input');
  kleurTxt.type = 'text';
  kleurTxt.id = 'kleur-txt';
  kleurTxt.placeholder = '#167455';
  kleurTxt.value = state.accentkleur || '';
  kleurTxt.maxLength = 7;
  const kleurPreview = document.createElement('div');
  kleurPreview.className = 'kleur-preview';
  kleurPreview.style.background = state.accentkleur || '#167455';

  kleurPicker.addEventListener('input', () => {
    state.accentkleur = kleurPicker.value;
    kleurTxt.value = kleurPicker.value;
    kleurPreview.style.background = kleurPicker.value;
  });
  kleurTxt.addEventListener('input', () => {
    const v = kleurTxt.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      state.accentkleur = v;
      kleurPicker.value = v;
      kleurPreview.style.background = v;
    }
  });
  kleurRij.appendChild(kleurPicker);
  kleurRij.appendChild(kleurTxt);
  kleurRij.appendChild(kleurPreview);
  body.appendChild(kleurRij);

  // ── 5. VERZENDLIJST ───────────────────────────────
  addLabel(body, '📬 Verzendlijst');
  addTekst(body, 'info-tekst',
    'Gemeenteleden schrijven zich in via de link of QR-code hieronder. ' +
    'Zij kiezen zelf wat en hoe vaak ze willen ontvangen.');

  // QR + link
  const qrSectie = document.createElement('div');
  qrSectie.className = 'qr-sectie';
  const qrImg = document.createElement('img');
  qrImg.src = '/api/admin/qr';
  qrImg.alt = 'QR-code inschrijfpagina';
  qrImg.onerror = () => { qrImg.style.display = 'none'; };
  const qrRechts = document.createElement('div');
  qrRechts.className = 'qr-rechts';
  const linkInp = document.createElement('input');
  linkInp.type = 'text'; linkInp.id = 'inschrijf-link';
  linkInp.readOnly = true; linkInp.placeholder = 'Laden…';
  const kopieerKnop = document.createElement('button');
  kopieerKnop.style.cssText = 'margin-top:0;font-size:.82rem;padding:6px 12px';
  kopieerKnop.textContent = 'Kopiëren';
  kopieerKnop.addEventListener('click', () => {
    navigator.clipboard.writeText(linkInp.value).then(() => {
      kopieerKnop.textContent = '✓ Gekopieerd'; setTimeout(() => kopieerKnop.textContent = 'Kopiëren', 1800);
    });
  });
  const qrDl = document.createElement('a');
  qrDl.href = '/api/admin/qr?download=true';
  qrDl.style.cssText = 'display:block;font-size:.82rem;color:var(--brand);text-decoration:none;margin-top:5px';
  qrDl.textContent = '⬇ QR-code downloaden';
  qrRechts.appendChild(linkInp);
  qrRechts.appendChild(kopieerKnop);
  qrRechts.appendChild(qrDl);
  qrSectie.appendChild(qrImg);
  qrSectie.appendChild(qrRechts);
  body.appendChild(qrSectie);

  // Beheer-knop
  const beheerKnop = document.createElement('button');
  beheerKnop.textContent = '👥 Beheer leden & uitnodigingen';
  beheerKnop.style.marginBottom = '12px';
  beheerKnop.addEventListener('click', () => location.href = '/admin#tab-leden');
  body.appendChild(beheerKnop);

  // Toggle inschrijving open/dicht
  const toggleRij = document.createElement('div');
  toggleRij.className = 'toggle-rij';
  const chk = document.createElement('input');
  chk.type = 'checkbox'; chk.id = 'inschrijving-open';
  chk.checked = state.inschrijvingOpen;
  chk.addEventListener('change', () => { state.inschrijvingOpen = chk.checked; });
  const lbl = document.createElement('label');
  lbl.htmlFor = 'inschrijving-open';
  lbl.textContent = 'Inschrijving open — gemeenteleden kunnen zich via de link aanmelden';
  toggleRij.appendChild(chk);
  toggleRij.appendChild(lbl);
  body.appendChild(toggleRij);

  // Lazy-load inschrijflink
  fetch('/api/admin/inschrijflink')
    .then(r => r.json())
    .then(d => { const el = document.getElementById('inschrijf-link'); if (el) el.value = d.url || ''; })
    .catch(() => {});

  // ── Opslaan ───────────────────────────────────────
  const opslaanKnop = document.createElement('button');
  opslaanKnop.textContent = 'Opslaan & afronden →';
  opslaanKnop.style.cssText = 'margin-top:22px;width:100%';
  opslaanKnop.addEventListener('click', slaStap2Op);
  body.appendChild(buildNav(() => openStap(1), null));
  body.appendChild(opslaanKnop);
}

// ───── Diensten renderen ─────
function renderDiensten(container) {
  container.innerHTML = '';
  state.diensten.forEach((d, i) => {
    const rij = document.createElement('div');
    rij.className = 'dienst-rij';

    const dagSel = document.createElement('select');
    dagSel.style.minWidth = '110px';
    DAG_NAMEN.forEach((naam, idx) => {
      const o = document.createElement('option');
      o.value = idx; o.textContent = naam;
      dagSel.appendChild(o);
    });
    dagSel.value = d.dag;
    dagSel.addEventListener('change', () => { state.diensten[i].dag = +dagSel.value; });

    const omSpan = document.createElement('span');
    omSpan.textContent = 'om'; omSpan.style.color = 'var(--muted)';

    const tijdInp = document.createElement('input');
    tijdInp.type = 'time'; tijdInp.value = d.tijd;
    tijdInp.addEventListener('input', () => { state.diensten[i].tijd = tijdInp.value; });

    const del = document.createElement('button');
    del.className = 'del-knop'; del.textContent = '✕'; del.title = 'Verwijderen';
    del.style.display = state.diensten.length > 1 ? '' : 'none';
    del.addEventListener('click', () => {
      state.diensten.splice(i, 1);
      renderDiensten(container);
    });

    rij.appendChild(dagSel); rij.appendChild(omSpan);
    rij.appendChild(tijdInp); rij.appendChild(del);
    container.appendChild(rij);
  });
}

// ───── Controle detail ─────
function bouwControleDetail(el) {
  el.innerHTML = '';

  // Hoe werkt het
  const uitleg = document.createElement('p');
  uitleg.className = 'info-tekst';
  uitleg.innerHTML =
    '<strong>Zo werkt het:</strong> Na de verwerking ontvangen de controleurs een mail met een ' +
    'persoonlijke link. Via die pagina kunnen zij de samenvatting, overdenkingen en vragen bekijken ' +
    'en direct aanpassen. Zodra iedereen goedkeurt (of de deadline verstrijkt), gaat alles naar de verzendlijst.';
  el.appendChild(uitleg);

  const emailLabel = document.createElement('div');
  emailLabel.className = 'sectie-label';
  emailLabel.style.marginTop = '12px';
  emailLabel.textContent = 'Wie ontvangen de controlemail?';
  el.appendChild(emailLabel);

  const emailInp = document.createElement('input');
  emailInp.type = 'email'; emailInp.id = 'controle-emails';
  emailInp.placeholder = 'dominee@kerk.nl, ouderling@kerk.nl';
  emailInp.value = state.controleEmails;
  emailInp.addEventListener('input', () => { state.controleEmails = emailInp.value; });
  emailInp.style.width = '100%';
  el.appendChild(emailInp);

  const deadlineLabel = document.createElement('div');
  deadlineLabel.className = 'sectie-label';
  deadlineLabel.style.marginTop = '14px';
  deadlineLabel.textContent = 'Wat als niet op tijd gecheckt?';
  el.appendChild(deadlineLabel);

  const grp = document.createElement('div');
  grp.className = 'radio-groep';

  const optV = maakRadioOptie('deadline-keuze', 'versturen',
    state.alsNietGecheckt === 'versturen',
    'Alsnog versturen',
    'Na 48 uur gaat het automatisch de deur uit, ook zonder goedkeuring. ' +
    'Zo staat de inhoud altijd op tijd klaar.',
    '<span class="badge badge-groen">Aanbevolen</span>');
  optV.addEventListener('click', () => {
    state.alsNietGecheckt = 'versturen';
    grp.querySelectorAll('.radio-optie').forEach(o => o.classList.remove('gekozen'));
    optV.classList.add('gekozen');
    optV.querySelector('input').checked = true;
  });

  const optB = maakRadioOptie('deadline-keuze', 'blokkeren',
    state.alsNietGecheckt === 'blokkeren',
    'Niet versturen',
    'Als de controle uitblijft, wordt er niets verstuurd die week. ' +
    'Gebruik dit alleen als jullie controle écht noodzakelijk is.',
    '');
  optB.addEventListener('click', () => {
    state.alsNietGecheckt = 'blokkeren';
    grp.querySelectorAll('.radio-optie').forEach(o => o.classList.remove('gekozen'));
    optB.classList.add('gekozen');
    optB.querySelector('input').checked = true;
  });

  grp.appendChild(optV);
  grp.appendChild(optB);
  el.appendChild(grp);
}

function herarrangeerControle(body) {
  // Update radio optie styling
  body.querySelectorAll('.radio-optie').forEach(o => {
    const inp = o.querySelector('input[name=controle-keuze]');
    if (!inp) return;
    const isCheck = inp.value === 'check';
    const selected = isCheck ? state.controleVoorVerzending : !state.controleVoorVerzending;
    o.classList.toggle('gekozen', selected);
    inp.checked = selected;
  });
  // Show/hide detail
  const detail = document.getElementById('controle-detail');
  if (detail) detail.style.display = state.controleVoorVerzending ? 'block' : 'none';
}

// ───── Radio optie bouwen ─────
function maakRadioOptie(name, value, gekozen, titel, omschr, badge) {
  const div = document.createElement('div');
  div.className = 'radio-optie' + (gekozen ? ' gekozen' : '');
  const inp = document.createElement('input');
  inp.type = 'radio'; inp.name = name; inp.value = value;
  inp.checked = gekozen; inp.style.pointerEvents = 'none';
  const cont = document.createElement('div');
  cont.className = 'ro-inhoud';
  cont.innerHTML =
    `<p class="ro-titel">${titel}${badge}</p>` +
    (omschr ? `<p class="ro-omschr">${omschr}</p>` : '');
  div.appendChild(inp); div.appendChild(cont);
  return div;
}

// ===================================================
// Save
// ===================================================
async function slaStap2Op() {
  const knop = document.querySelector('[onclick], button:last-of-type') ||
               document.createElement('button');
  try {
    // Kanaalinstellingen opslaan
    await fetch('/api/admin/kanaal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        kanaal_url:              state.kanaalUrl,
        diensten:                state.diensten,
        controle_voor_verzending: state.controleVoorVerzending,
        controle_emails:         state.controleEmails,
        als_niet_gecheckt:       state.alsNietGecheckt,
        auto_versturen:          !state.controleVoorVerzending,
        inschrijving_open:       state.inschrijvingOpen,
        waarschuwingstekst:      state.waarschuwingstekst,
        accentkleur:             state.accentkleur,
      }),
    });

    // Logo uploaden als er een nieuw bestand is
    if (state.logoBestand) {
      const fd = new FormData();
      fd.append('logo', state.logoBestand);
      await fetch('/api/admin/logo', { method: 'POST', body: fd });
    }

    toonSucces();
  } catch (e) {
    alert('Opslaan mislukt: ' + e.message);
  }
}

function toonSucces() {
  const w = document.getElementById('wizard');
  w.innerHTML = `
    <div class="stap open bereikbaar klaar">
      <div class="stap-kop">
        <div class="stap-nr" style="background:var(--brand);color:#fff">✓</div>
        <div class="stap-titelrij">
          <span class="stap-titel">Alles is ingesteld!</span>
        </div>
      </div>
      <div class="stap-body" style="display:block">
        <div class="finish-blok">
          <div class="finish-icon">🎉</div>
          <p>AfterSermon is klaar om te draaien. Verwerk je eerste preek of ga naar het dashboard.</p>
          <button onclick="location.href='/'">→ Naar het dashboard</button>
          <button class="btn-terug" onclick="location.href='/admin'" style="margin-top:8px">Beheer</button>
        </div>
      </div>
    </div>`;
}

// ===================================================
// DOM helpers
// ===================================================
function buildNav(terug, verder) {
  const rij = document.createElement('div');
  rij.className = 'nav-rij';
  if (terug) {
    const b = document.createElement('button');
    b.className = 'btn-terug'; b.textContent = '← Terug';
    b.addEventListener('click', terug);
    rij.appendChild(b);
  }
  if (verder) {
    const b = document.createElement('button');
    b.textContent = 'Volgende →';
    b.addEventListener('click', verder);
    rij.appendChild(b);
  }
  return rij;
}

function addLabel(parent, tekst) {
  const d = document.createElement('div');
  d.className = 'sectie-label';
  d.innerHTML = tekst; // allows emoji + text
  parent.appendChild(d);
}

function addTekst(parent, cls, tekst) {
  const p = document.createElement('p');
  p.className = cls; p.textContent = tekst;
  parent.appendChild(p);
}

// ===================================================
// Init — bestaande instellingen laden
// ===================================================
(async function init() {
  try {
    const mij = await fetch('/api/admin/mij').then(r => r.json()).catch(() => ({}));
    if (mij.ingelogd) {
      if (mij.kanaal_url)               state.kanaalUrl = mij.kanaal_url;
      if (mij.diensten?.length)         state.diensten = mij.diensten;
      if (mij.controle_voor_verzending != null) state.controleVoorVerzending = !!mij.controle_voor_verzending;
      if (mij.controle_emails)          state.controleEmails = mij.controle_emails;
      if (mij.als_niet_gecheckt)        state.alsNietGecheckt = mij.als_niet_gecheckt;
      if (mij.auto_versturen != null)   { /* afgeleid van controleVoorVerzending */ }
      if (mij.inschrijving_open != null) state.inschrijvingOpen = !!mij.inschrijving_open;
      if (mij.waarschuwingstekst)       state.waarschuwingstekst = mij.waarschuwingstekst;
      if (mij.accentkleur)              state.accentkleur = mij.accentkleur;
      if (mij.kerk_id)                  window._kerkId = mij.kerk_id;
      // Als kanaal al gekoppeld is, start direct op stap 2
      if (state.kanaalUrl) state.actieveStap = 2;
    }
  } catch (_) {}
  renderWizard();
})();
</script>
