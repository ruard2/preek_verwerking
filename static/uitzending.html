<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overdenking bekijken en goedkeuren</title>
<style>
  :root { --groen:#2c5f2d; --rand:#e2e2dd; --tekst:#23231f; --grijs:#6b6b64; --bg:#faf9f5; --kaart:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --groen:#7bb87c; --rand:#33332e; --tekst:#ecebe4; --grijs:#a5a59b; --bg:#17171a; --kaart:#1f1f22; }
  }
  * { box-sizing: border-box; }
  body { font-family: Georgia, serif; max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem;
    background: var(--bg); color: var(--tekst); line-height: 1.55; }
  h1 { font-size: 1.5rem; color: var(--groen); margin: 0 0 .2rem; }
  .sub { color: var(--grijs); margin-top: 0; }
  .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--grijs);
    margin: .8rem 0 .15rem; font-family: system-ui, sans-serif; }
  input, textarea { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 1rem;
    padding: .5rem .7rem; border: 1px solid var(--rand); border-radius: .45rem;
    background: var(--kaart); color: var(--tekst); line-height: 1.5; }
  textarea { resize: vertical; }
  .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: .7rem;
    padding: 1.1rem 1.3rem; margin-bottom: 1rem; }
  .balk { position: sticky; top: 0; background: var(--bg); padding: .8rem 0; display: flex; gap: .6rem;
    flex-wrap: wrap; border-bottom: 1px solid var(--rand); margin-bottom: 1rem; z-index: 5; }
  button { font-family: inherit; font-size: 1rem; border: none; border-radius: .45rem; cursor: pointer;
    padding: .55rem 1.2rem; }
  .primair { background: var(--groen); color: #fff; }
  .grijs { background: var(--kaart); color: var(--tekst); border: 1px solid var(--rand); }
  .melding { padding: .7rem .9rem; border-radius: .45rem; margin-bottom: 1rem; }
  .ok { background: #e9f5ea; color: #1f6b25; } .fout { background: #fdecea; color: #b0201a; }
  @media (prefers-color-scheme: dark) { .ok { background:#1c2a1c; color:#9fd6a3; } .fout { background:#3a1c1a; color:#f0a9a3; } }
</style>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <div id="melding"></div>
  <div id="inhoud"></div>
<script src="/static/ui-i18n.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
const params = new URLSearchParams(location.search);
const meldingEl = document.getElementById('melding');
const inhoud = document.getElementById('inhoud');
function toon(soort, tekst) { meldingEl.innerHTML = tekst ? `<div class="melding ${soort}">${tekst}</div>` : ''; }
function el(tag, cls, tekst) { const e = document.createElement(tag); if (cls) e.className = cls; if (tekst != null) e.textContent = tekst; return e; }
async function fout(r) { const d = await r.json().catch(()=>({})); return (typeof d.detail==='string'?d.detail:null) || 'Er ging iets mis.'; }
const T = s => AfterSermonI18n.text(s);

if (params.get('goedgekeurd')) toon('ok', T('Goedgekeurd. De overdenkingen worden op de ingestelde tijden verstuurd.'));
if (params.get('fout')) toon('fout', T('Deze link is ongeldig of verlopen.'));

let refs = {};
if (!token) toon('fout', T('Geen geldige link.'));
else fetch('/api/uitzending/' + token).then(r => r.ok ? r.json() : Promise.reject(r))
  .then(u => { AfterSermonI18n.set(u.communicatie_taal || 'auto'); bouw(u); })
  .catch(() => toon('fout', T('Deze link is ongeldig of verlopen.')));

function bouwVerwerk(u) {
  inhoud.innerHTML = '';
  inhoud.appendChild(el('h1', null, u.titel));
  inhoud.appendChild(el('p', 'sub', T('Dienst van') + ' ' + u.datum));

  // Optie 1: via het kanaal (audio/ondertitels transcriberen).
  const k = el('div', 'kaart');
  k.appendChild(el('div', 'label', T('Optie 1 — via het kanaal')));
  k.appendChild(el('p', null, T('Laat de preek automatisch ophalen en transcriberen, en maak er een weekboekje van. Dat kan een paar minuten duren.')));
  const knop = el('button', 'primair', T('Verwerk deze preek'));
  knop.onclick = async () => {
    knop.disabled = true; knop.textContent = T('Bezig met verwerken…');
    toon('', '');
    try {
      const r = await fetch('/api/uitzending/verwerk', {method: 'POST',
        headers: {'Content-Type':'application/json'}, body: JSON.stringify({token})});
      if (!r.ok) throw new Error(await fout(r));
      const res = await r.json();
      bouw({...u, verwerkt: true, data: res.data, tekst: res.tekst});
    } catch (f) { toon('fout', f.message); knop.disabled = false; knop.textContent = T('Verwerk deze preek'); }
  };
  k.appendChild(knop);
  inhoud.appendChild(k);

  // Optie 2: eigen preektekst uploaden (geen audio nodig).
  const k2 = el('div', 'kaart');
  k2.appendChild(el('div', 'label', T('Optie 2 — je eigen preektekst of audio')));
  k2.appendChild(el('p', null, T('Heb je je preek als document (PDF, DOCX, TXT) of als audio (MP3)? Upload hem hier; daar wordt direct een weekboekje van gemaakt. Bij een document hoeft er niets beluisterd te worden; audio wordt eerst getranscribeerd en het bestand daarna direct verwijderd.')));
  const fileIn = el('input'); fileIn.type = 'file'; fileIn.accept = '.pdf,.docx,.txt,.mp3,.m4a,.wav,.ogg';
  k2.appendChild(fileIn);
  const upknop = el('button', 'grijs', T('Verwerk geüploade tekst'));
  upknop.onclick = async () => {
    const f = fileIn.files[0];
    if (!f) { toon('fout', T('Kies eerst een bestand.')); return; }
    upknop.disabled = true; upknop.textContent = T('Bezig met verwerken…'); toon('', '');
    try {
      const fd = new FormData(); fd.append('token', token); fd.append('file', f);
      const r = await fetch('/api/uitzending/upload', {method: 'POST', body: fd});
      if (!r.ok) throw new Error(await fout(r));
      const res = await r.json();
      bouw({...u, verwerkt: true, data: res.data, tekst: res.tekst});
    } catch (f2) { toon('fout', f2.message); upknop.disabled = false; upknop.textContent = T('Verwerk geüploade tekst'); }
  };
  k2.appendChild(el('br')); k2.appendChild(upknop);
  inhoud.appendChild(k2);
}

function veld(label, waarde, multiline, rows) {
  const w = el('div'); w.appendChild(el('div', 'label', label));
  const i = document.createElement(multiline ? 'textarea' : 'input');
  i.value = waarde || ''; if (multiline) i.rows = rows || 3;
  w.appendChild(i); return {w, i};
}

function bouw(u) {
  if (!u.verwerkt) { bouwVerwerk(u); return; }
  const d = u.data || {}; const L = d._labels || {};
  inhoud.innerHTML = '';

  const balk = el('div', 'balk');
  const opslaan = el('button', 'grijs', T('Wijzigingen opslaan'));
  const test = el('button', 'grijs', T('Stuur test naar mezelf'));
  const keur = el('button', 'primair', u.goedgekeurd ? T('Opnieuw versturen goedkeuren') : T('Goedkeuren & versturen'));
  test.onclick = async () => {
    test.disabled = true; test.textContent = T('Versturen…');
    try {
      const r = await fetch('/api/uitzending/test', {method: 'POST',
        headers: {'Content-Type':'application/json'}, body: JSON.stringify({token})});
      if (!r.ok) throw new Error(await fout(r));
      const d = await r.json();
      toon('ok', T('Testmail verstuurd naar') + ' ' + d.naar + '.');
    } catch (f) { toon('fout', f.message); }
    test.disabled = false; test.textContent = T('Stuur test naar mezelf');
  };
  balk.append(opslaan, test, keur);
  if (u.goedgekeurd) {
    const concept = el('button', 'grijs', T('Terug naar concept'));
    concept.onclick = async () => {
      const r = await fetch('/api/uitzending/concept', {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({token})});
      if (r.ok) { u.goedgekeurd = false; u.goedgekeurd_op = null; bouw(u); toon('ok','Teruggezet naar concept.'); }
    };
    balk.appendChild(concept);
  }
  inhoud.appendChild(balk);

  let status = u.goedgekeurd ? ' · goedgekeurd' : ' · nog niet goedgekeurd';
  if (u.goedgekeurd && u.goedgekeurd_op) status += ' op ' + u.goedgekeurd_op.slice(0,10)
    + (u.goedgekeurd_door ? ' door ' + u.goedgekeurd_door : '');
  inhoud.appendChild(el('h1', null, u.titel));
  inhoud.appendChild(el('p', 'sub', 'Dienst van ' + u.datum + status));

  const kop = el('div', 'kaart');
  const fTitel = veld('Titel', d.titel); kop.appendChild(fTitel.w);
  const fBg = veld(L.bijbelgedeelte || 'Bijbelgedeelte', d.bijbelgedeelte); kop.appendChild(fBg.w);
  const fVg = veld(L.voorganger || 'Voorganger', d.voorganger); kop.appendChild(fVg.w);
  const fSam = veld(L.samenvatting || 'Samenvatting', d.samenvatting, true, 5); kop.appendChild(fSam.w);
  inhoud.appendChild(kop);
  refs = {titel: fTitel.i, bijbelgedeelte: fBg.i, voorganger: fVg.i, samenvatting: fSam.i, dagen: []};

  (d.dagen || []).forEach((dag, idx) => {
    const k = el('div', 'kaart');
    k.appendChild(el('div', 'label', (L.dag || 'Dag') + ' ' + (idx + 1)));
    const t = veld('Titel', dag.titel);
    const bt = veld(L.bijbeltekst || 'Bijbeltekst', dag.bijbeltekst);
    const g = veld(L.gedachte || 'Gedachte', dag.gedachte, true, 4);
    const vv = veld(L.vraag || 'Vraag', dag.vraag_volwassenen, true, 2);
    const vk = veld(L.vraag_kinderen || 'Vraag voor kinderen', dag.vraag_kinderen, true, 2);
    [t, bt, g, vv, vk].forEach(x => k.appendChild(x.w));
    inhoud.appendChild(k);
    refs.dagen.push({titel: t.i, bijbeltekst: bt.i, gedachte: g.i, vraag_volwassenen: vv.i, vraag_kinderen: vk.i});
  });

  if (d.liturgie) {
    const k = el('div', 'kaart');
    const lit = veld(L.liturgie || 'Liturgie', d.liturgie, true, 8);
    k.appendChild(lit.w); inhoud.appendChild(k); refs.liturgie = lit.i;
  }

  opslaan.onclick = async () => {
    opslaan.disabled = true; opslaan.textContent = 'Opslaan…';
    try {
      const velden = {titel: refs.titel.value, bijbelgedeelte: refs.bijbelgedeelte.value,
        voorganger: refs.voorganger.value, samenvatting: refs.samenvatting.value,
        dagen: refs.dagen.map(r => ({titel: r.titel.value, bijbeltekst: r.bijbeltekst.value,
          gedachte: r.gedachte.value, vraag_volwassenen: r.vraag_volwassenen.value,
          vraag_kinderen: r.vraag_kinderen.value}))};
      if (refs.liturgie) velden.liturgie = refs.liturgie.value;
      const r = await fetch('/api/uitzending/bewerk', {method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({token, velden})});
      if (!r.ok) throw new Error(await fout(r));
      toon('ok', 'Wijzigingen opgeslagen.');
    } catch (f) { toon('fout', f.message); }
    opslaan.disabled = false; opslaan.textContent = 'Wijzigingen opslaan';
  };
  keur.onclick = async () => {
    if (!confirm('Goedkeuren? De overdenkingen worden dan op de ingestelde tijden naar de inschrijvers verstuurd.')) return;
    keur.disabled = true; keur.textContent = 'Bezig…';
    try {
      const r = await fetch('/api/uitzending/goedkeuren', {method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({token})});
      if (!r.ok) throw new Error(await fout(r));
      toon('ok', 'Goedgekeurd. De overdenkingen worden op de ingestelde tijden verstuurd.');
      window.scrollTo(0, 0);
    } catch (f) { toon('fout', f.message); keur.disabled = false; keur.textContent = 'Goedkeuren & versturen'; }
  };
}
</script>
</body>
</html>
