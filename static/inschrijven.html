<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aanmelden voor de overdenkingen</title>
<style>
  :root { --groen:#2c5f2d; --rand:#e2e2dd; --tekst:#23231f; --grijs:#6b6b64; --bg:#faf9f5; --kaart:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --groen:#7bb87c; --rand:#33332e; --tekst:#ecebe4; --grijs:#a5a59b; --bg:#17171a; --kaart:#1f1f22; }
  }
  * { box-sizing: border-box; }
  body { font-family: Georgia, serif; max-width: 32rem; margin: 0 auto; padding: 2.5rem 1.25rem;
    background: var(--bg); color: var(--tekst); line-height: 1.6; }
  h1 { font-size: 1.5rem; color: var(--groen); margin: 0 0 .3rem; }
  .sub { color: var(--grijs); margin-top: 0; }
  label { display: block; font-size: .8rem; color: var(--grijs); margin: .8rem 0 .15rem;
    text-transform: uppercase; letter-spacing: .05em; font-family: system-ui, sans-serif; }
  input, select { width: 100%; padding: .55rem .7rem; font-size: 1rem; font-family: inherit;
    border: 1px solid var(--rand); border-radius: .45rem; background: var(--kaart); color: var(--tekst); }
  button { margin-top: 1.2rem; padding: .65rem 1.4rem; font-size: 1rem; font-family: inherit;
    border: none; border-radius: .45rem; background: var(--groen); color: #fff; cursor: pointer; }
  .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: .7rem; padding: 1.4rem; margin-top: 1.2rem; }
  .melding { padding: .7rem .9rem; border-radius: .45rem; margin-top: 1rem; }
  .ok { background: #e9f5ea; color: #1f6b25; } .fout { background: #fdecea; color: #b0201a; }
  .bedankt { text-align:center; padding:2.5rem 2rem; }
  .bedankt-icoon { width:3.5rem; height:3.5rem; margin:0 auto 1.1rem; border-radius:50%;
    display:grid; place-items:center; background:var(--soft); color:var(--groen);
    font-size:1.7rem; font-weight:800; }
  .bedankt h2 { font-size:1.45rem; margin:.2rem 0 .65rem; }
  .bedankt p { max-width:30rem; margin:.35rem auto; color:var(--grijs); }
  @media (prefers-color-scheme: dark) { .ok { background:#1c2a1c; color:#9fd6a3; } .fout { background:#3a1c1a; color:#f0a9a3; } }
  .uitvoer-groep { display:flex; flex-direction:column; gap:.5rem; margin:.3rem 0 .6rem; }
  .uitvoer-blok { border:1.5px solid var(--rand); border-radius:.55rem; padding:.7rem .85rem;
    transition:border-color .15s; }
  .uitvoer-blok:has(.uitvoer-chk:checked) { border-color: var(--groen); background: rgba(44,95,45,.05); }
  .uitvoer-optie { display:flex; align-items:flex-start; gap:.55rem; text-transform:none;
    letter-spacing:normal; font-size:.95rem; color:var(--tekst); margin:0; cursor:pointer; }
  .uitvoer-optie input { width:auto; flex:none; margin-top:.2rem; accent-color:var(--groen); }
  .uitvoer-naam { display:block; font-weight:600; }
  .uitvoer-omschr { display:block; font-size:.8rem; color:var(--grijs); margin-top:.1rem; line-height:1.45; }
  .dag-timing { margin:.55rem 0 .2rem .2rem; display:flex; flex-direction:column; gap:.4rem; }
  .dag-timing-rij { display:flex; align-items:center; gap:.5rem; }
  .dag-timing-rij select, .dag-timing-rij input { margin:0; flex:1; }
  .direct-info { font-size:.78rem; color:var(--grijs); margin:.35rem 0 0 .2rem; line-height:1.45; }
  .kerk-info { opacity:.75; }
</style>
<link rel="stylesheet" href="/static/dashboard.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#167455">
<link rel="apple-touch-icon" href="/static/icon.svg">
</head>
<body>
  <h1 id="titel">Aanmelden</h1>
  <p class="sub" id="onder">Ontvang de wekelijkse overdenkingen bij de preek.</p>
  <div id="melding"></div>
  <div id="inhoud"></div>
  <p style="margin-top:2.5rem;font-size:.8rem"><a href="/privacy" style="color:var(--grijs)">Privacyverklaring</a></p>
<script src="/static/ui-i18n.js"></script>
<script src="/static/push-client.js"></script>
<script>
const params = new URLSearchParams(location.search);
const kerkId = params.get('kerk');
const meldingEl = document.getElementById('melding');
const inhoud = document.getElementById('inhoud');
function toon(soort, tekst) { meldingEl.innerHTML = `<div class="melding ${soort}">${tekst}</div>`; }
const val = id => document.getElementById(id).value.trim();

async function fouttekst(r) { const d = await r.json().catch(()=>({})); return (typeof d.detail==='string'?d.detail:null) || 'Er ging iets mis.'; }

if (params.get('bevestig_mislukt')) toon('fout', 'Deze bevestigingslink is ongeldig of verlopen.');

if (!kerkId) {
  toon('fout', 'Geen kerk opgegeven in de link.');
} else {
  fetch('/api/kerk/' + kerkId).then(r => r.ok ? r.json() : Promise.reject())
    .then(k => {
      AfterSermonI18n.set(k.inschrijf_taal || 'auto');
      if (k.accentkleur) document.documentElement.style.setProperty('--groen', k.accentkleur);
      if (k.heeft_logo) {
        const logo = document.createElement('img');
        logo.src = '/logo/' + kerkId;
        logo.alt = k.naam || '';
        logo.style.cssText = 'max-height:72px;max-width:240px;display:block;margin:0 0 1rem';
        document.getElementById('titel').before(logo);
      }
      if (params.get('bevestigd')) toonBedankt(k);
      else if (k.inschrijving_open === false) {
        document.getElementById('titel').textContent = k.naam || 'AfterSermon';
        inhoud.innerHTML = '<div class="kaart"><p>' +
          AfterSermonI18n.text('De inschrijving voor deze kerk is op dit moment gesloten.') + '</p></div>';
      } else {
        document.getElementById('titel').textContent =
          AfterSermonI18n.text('Aanmelden') + ' — ' + k.naam;
        bouwFormulier(k);
      }
    })
    .catch(() => toon('fout', 'Deze kerk bestaat niet (controleer de link).'));
}

function toonBedankt(kerk) {
  meldingEl.innerHTML = '';
  document.getElementById('titel').textContent = 'AfterSermon';
  document.getElementById('onder').textContent = kerk.naam;
  inhoud.innerHTML = `
    <div class="kaart bedankt">
      <div class="bedankt-icoon" aria-hidden="true">✓</div>
      <h2>${AfterSermonI18n.text('Bedankt voor je aanmelding!')}</h2>
      <p>${AfterSermonI18n.text('Je e-mailadres is bevestigd. Vanaf nu ontvang je de overdenkingen van deze kerk volgens de gekozen frequentie.')}</p>
      <p>${AfterSermonI18n.text('We hopen dat ze je helpen om de boodschap van zondag mee te nemen in de week.')}</p>
    </div>`;

  const vt = params.get('vt');
  if (vt && window.AfterSermonPush) {
    const T = s => AfterSermonI18n.text(s);
    const kaart = document.createElement('div'); kaart.className = 'kaart';
    if (AfterSermonPush.iOSnietGeinstalleerd()) {
      kaart.innerHTML = `<h2>${T('Meldingen op je iPhone')}</h2>` +
        `<p class="sub">${T('Tik onderin op Deel en kies "Zet op beginscherm". Open AfterSermon daarna vanaf je beginscherm en zet meldingen aan.')}</p>`;
    } else {
      kaart.innerHTML = `<h2>${T('Meldingen aanzetten')}</h2>` +
        `<p class="sub">${T('Ontvang de overdenkingen als melding op dit apparaat.')}</p>`;
      const knop = document.createElement('button');
      knop.textContent = T('Meldingen aanzetten');
      knop.onclick = () => AfterSermonPush.aanzetten(vt, (soort, tekst) => {
        const m = document.createElement('div'); m.className = 'melding ' + soort;
        m.textContent = tekst; kaart.appendChild(m);
      });
      kaart.appendChild(knop);
    }
    inhoud.appendChild(kaart);
  }
}

const UITVOER_LABEL = {
  dagstukjes:        'Dagstukjes',
  preeksamenvatting: 'Samenvatting',
  nabespreking:      'Vragen voor groepen',
  preektranscript:   'Preektekst',
};

// Beschrijving per onderdeel (getoond onder de checkbox)
const UITVOER_OMSCHR = {
  dagstukjes:        'Zeven korte overdenkingen — één per dag, met Bijbeltekst en vragen.',
  preeksamenvatting: 'Samenvatting van 400–600 woorden met de lijn en boodschap van de preek.',
  nabespreking:      'Vragen om als huisgroep of gezin de preek verder te bespreken.',
  preektranscript:   'De volledige, opgeschoonde preektekst om rustig na te lezen.',
};

const DAGEN_KORT = ['ma','di','wo','do','vr','za','zo'];
const DAGEN_LANG = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];

function bouwFormulier(k) {
  const t = s => AfterSermonI18n.text(s);
  const beschikbaar = (k.uitvoer_beschikbaar || Object.keys(UITVOER_LABEL)).filter(x => UITVOER_LABEL[x]);

  // Build uitvoer checkboxes with inline timing for dagstukjes
  const uitvoerRijen = beschikbaar.map(x => {
    const isDag = x === 'dagstukjes';
    return `
      <div class="uitvoer-blok" id="blok-${x}">
        <label class="uitvoer-optie">
          <input type="checkbox" class="uitvoer-chk" value="${x}" checked
            ${isDag ? 'onchange="toggleDagstukjesTiming(this)"' : ''}>
          <span>
            <span class="uitvoer-naam">${t(UITVOER_LABEL[x])}</span>
            <span class="uitvoer-omschr">${t(UITVOER_OMSCHR[x])}</span>
          </span>
        </label>
        ${isDag ? dagstukjesTiming(t) : directInfo(t)}
      </div>`;
  }).join('');

  inhoud.innerHTML = `
    <div class="kaart">
      <label for="naam">${t('Naam')}</label><input id="naam">
      <label for="email">${t('E-mailadres *')}</label><input id="email" type="email" required>
      <label for="tel">${t('Telefoonnummer (optioneel)')}</label><input id="tel">
      <label for="ww">${t('Wachtwoord (optioneel)')}</label>
      <input id="ww" type="password" autocomplete="new-password" placeholder="${t('Minimaal 8 tekens — om later in te loggen')}">
      <p class="direct-info" style="margin-top:.25rem">${t('Met een wachtwoord kun je later inloggen op aftersermon.nl om je voorkeuren aan te passen.')}</p>
      <label style="margin-top:.8rem">${t('Wat wil je ontvangen?')}</label>
      <div class="uitvoer-groep">${uitvoerRijen}</div>
      <label for="dienst">${t('Welke dienst(en)?')}</label>
      <select id="dienst">
        <option value="beide">${t('Beide diensten')}</option>
        <option value="ochtend">${t('Alleen de ochtenddienst')}</option>
        <option value="avond">${t('Alleen de avonddienst')}</option>
      </select>
      <label for="kanaal">${t('Hoe wil je ontvangen?')}</label>
      <select id="kanaal">
        <option value="email">${t('Per e-mail')}</option>
        <option value="push">${t('Als melding op mijn telefoon of computer')}</option>
        <option value="beide">${t('Allebei')}</option>
      </select>
      <button id="knop">${t('Aanmelden')}</button>
    </div>`;

  document.getElementById('knop').onclick = async () => {
    if (!val('email')) { toon('fout', t('Vul je e-mailadres in.')); return; }
    const gekozen = [...document.querySelectorAll('.uitvoer-chk:checked')].map(c => c.value);
    if (!gekozen.length) { toon('fout', t('Kies minimaal één onderdeel.')); return; }

    // Frequentie voor dagstukjes
    const dagChk = document.querySelector('.uitvoer-chk[value=dagstukjes]');
    const freqEl = document.getElementById('dag-freq');
    const dagTijdEl = document.getElementById('dag-tijd');

    try {
      const wwVeld = document.getElementById('ww');
      const wachtwoord = wwVeld ? wwVeld.value.trim() : '';
      const r = await fetch('/api/inschrijven', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          kerk_id:         +kerkId,
          naam:            val('naam'),
          email:           val('email'),
          telefoon:        val('tel'),
          frequentie:      (dagChk?.checked && freqEl) ? freqEl.value : 'wekelijks',
          ontvang_dag:     +(document.getElementById('dag-dag')?.value ?? 6),
          dagstukjes_tijd: (dagChk?.checked && dagTijdEl) ? dagTijdEl.value : null,
          dienstvoorkeur:  val('dienst'),
          kanaal:          val('kanaal'),
          uitvoer_voorkeur: gekozen,
          wachtwoord:      wachtwoord || null,
        }),
      });
      if (!r.ok) throw new Error(await fouttekst(r));
      inhoud.innerHTML = '';
      toon('ok', t('Bijna klaar! We hebben je een bevestigingsmail gestuurd. Klik op de link daarin om je aanmelding af te ronden.'));
    } catch (f) { toon('fout', f.message); }
  };
}

function dagstukjesTiming(t) {
  // Gebruik integer-indices (0=ma..6=zo) zodat het backend ze direct kan opslaan.
  const dagOpties = DAGEN_LANG.map((d, i) =>
    `<option value="${i}">${d}</option>`).join('');
  return `
    <div class="dag-timing" id="dag-timing-blok">
      <div class="dag-timing-rij">
        <label style="margin:0;min-width:110px">${t('Hoe vaak?')}</label>
        <select id="dag-freq" onchange="toggleDagFreq(this)">
          <option value="dagelijks">${t('Dagelijks (één per dag)')}</option>
          <option value="wekelijks">${t('Wekelijks (alles ineens)')}</option>
        </select>
      </div>
      <div class="dag-timing-rij" id="dag-dag-rij" style="display:none">
        <label style="margin:0;min-width:110px">${t('Welke dag?')}</label>
        <select id="dag-dag">${dagOpties}</select>
      </div>
      <div class="dag-timing-rij">
        <label style="margin:0;min-width:110px">${t('Hoe laat?')}</label>
        <input type="time" id="dag-tijd" value="07:00" style="flex:1;margin:0">
      </div>
    </div>`;
}

function directInfo(t) {
  return `<p class="direct-info">${t('Wordt direct verstuurd zodra de verwerking klaar is.')
    } <span class="kerk-info">${t('Als jullie kerk de inhoud eerst controleert, kan dit wat langer duren.')}</span></p>`;
}

function toggleDagstukjesTiming(chk) {
  const blok = document.getElementById('dag-timing-blok');
  if (blok) blok.style.display = chk.checked ? '' : 'none';
}

function toggleDagFreq(sel) {
  const dagRij = document.getElementById('dag-dag-rij');
  if (dagRij) dagRij.style.display = sel.value === 'wekelijks' ? '' : 'none';
}
</script>
</body>
</html>
