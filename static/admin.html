<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfterSermon</title>
<style>
  /* admin.html — specifieke stijlen; basis via dashboard.css */
  body { max-width: 44rem; margin: 0 auto; }

  h1 { font-family: var(--font-serif); font-size: 1.6rem; margin: 0 0 .25rem; color: var(--brand); }
  h2 { font-size: 1.1rem; margin: 1.5rem 0 .55rem; }
  .sub { color: var(--muted); margin-top: 0; font-size: .95rem; }

  /* Admin-tabs (bijv. Instellingen / Diensten) */
  .tabs { display: flex; gap: .4rem; margin-top: 1rem; flex-wrap: wrap; }
  .tabs button { margin: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .tabs button.actief { background: var(--brand); color: #fff; border-color: transparent; }

  :root { --rood: #c0392b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rood: #e55347; } }
  :root[data-theme="dark"] { --rood: #e55347; }

  .weg { display: none; }
</style>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <h1>AfterSermon</h1>
  <p class="sub" id="onderschrift">Van zondagse preek naar een week vol verdieping.</p>
  <div id="melding"></div>
  <div id="inhoud"></div>

<script src="/static/ui-i18n.js"></script>
<script src="/static/talen.js"></script>
<script>
const inhoud = document.getElementById('inhoud');
const meldingEl = document.getElementById('melding');
const params = new URLSearchParams(location.search);

function toon(soort, tekst) {
  meldingEl.innerHTML = '';
  if (!tekst) return;
  const d = document.createElement('div');
  d.className = 'melding ' + soort;
  d.textContent = tekst;
  meldingEl.appendChild(d);
}
async function fouttekst(r, standaard) {
  const d = await r.json().catch(() => ({}));
  if (typeof d.detail === 'string') return d.detail;
  if (Array.isArray(d.detail)) return d.detail.map(e => e.msg || '').join('; ') || standaard;
  return standaard;
}
function el(tag, attrs = {}, tekst) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  if (tekst != null) e.textContent = tekst;
  return e;
}
async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  });
  if (!r.ok) throw new Error(await fouttekst(r, 'Er ging iets mis.'));
  return r.json();
}

// ---- Views ----
function veld(labelTekst, id, type = 'text', waarde = '') {
  const wrap = el('div');
  wrap.appendChild(el('label', {htmlFor: id}, labelTekst));
  wrap.appendChild(el('input', {id, type, value: waarde}));
  return wrap;
}

const COMMUNITY_TOOLS_URL = 'https://www.communitytools.online/';

function toonLogin() {
  inhoud.innerHTML = '';
  const T = s => AfterSermonI18n.text(s);

  // Hero: wat AfterSermon doet.
  const hero = el('div', {className: 'kaart hero'});
  hero.innerHTML =
    '<p style="margin-top:0;font-size:1.06rem;line-height:1.6"><b>AfterSermon</b> ' +
    T('maakt van je zondagse preek automatisch een weekboekje: een korte samenvatting en zeven dagoverdenkingen met vragen voor volwassenen en kinderen — en mailt die elke week naar je gemeenteleden.') +
    '</p><p style="margin-bottom:0;color:var(--grijs)">' +
    T('Koppel je YouTube- of Kerkdienstgemist-kanaal en het gaat vanzelf.') + '</p>';
  inhoud.appendChild(hero);

  // Call-to-action: account aanmaken (bij Community Tools) + demo.
  const cta = el('div', {className: 'cta-rij'});
  const aanmaak = el('a', {href: COMMUNITY_TOOLS_URL}, T('Account aanmaken'));
  aanmaak.className = 'cta-knop';
  const demo = el('a', {href: '/demo'}, T('Bekijk de demo'));
  demo.className = 'cta-knop secundair';
  cta.append(aanmaak, demo);
  inhoud.appendChild(cta);

  // Uitleg: account/inloggen loopt via Community Tools.
  const uitleg = el('div', {className: 'kaart'}); uitleg.style.marginTop = '1rem';
  const p1 = el('p'); p1.style.margin = '0';
  p1.innerHTML = '<b>' + T('Je account maak je aan bij Community Tools.') + '</b> ' +
    T('Daar beheer je al je kerk-apps op één plek. Je maakt (of gebruikt) daar je account en opent AfterSermon vervolgens vanuit Community Tools.');
  const p2 = el('p'); p2.style.margin = '.7rem 0 0';
  const login = el('a', {href: COMMUNITY_TOOLS_URL}, T('Al een account? Open AfterSermon via Community Tools →'));
  login.style.cssText = 'color:var(--groen);font-weight:650';
  p2.appendChild(login);
  uitleg.append(p1, p2);
  inhoud.appendChild(uitleg);
}

function toonVergeten() {
  inhoud.innerHTML = '';
  const kaart = el('div', {className: 'kaart'}); inhoud.appendChild(kaart);
  kaart.appendChild(el('h2', {}, 'Wachtwoord vergeten'));
  kaart.appendChild(veld('E-mailadres', 'e', 'email'));
  const knop = el('button', {}, 'Stuur resetlink');
  knop.onclick = async () => {
    try {
      await post('/api/admin/reset-aanvraag', {email: val('e')});
      toon('ok', 'Als dit adres bekend is, is er een resetlink verstuurd. Check je e-mail.');
    } catch (f) { toon('fout', f.message); }
  };
  kaart.appendChild(knop);
  const terug = el('button', {className: 'link'}, '← Terug naar inloggen');
  terug.onclick = toonLogin; kaart.appendChild(terug);
}

function toonReset(token) {
  inhoud.innerHTML = '';
  const kaart = el('div', {className: 'kaart'}); inhoud.appendChild(kaart);
  kaart.appendChild(el('h2', {}, 'Nieuw wachtwoord instellen'));
  kaart.appendChild(veld('Nieuw wachtwoord (min. 8 tekens)', 'w', 'password'));
  const knop = el('button', {}, 'Opslaan');
  knop.onclick = async () => {
    try {
      await post('/api/admin/reset', {token, wachtwoord: val('w')});
      toon('ok', 'Wachtwoord gewijzigd. Je kunt nu inloggen.');
      history.replaceState({}, '', '/admin');
      toonLogin();
    } catch (f) { toon('fout', f.message); }
  };
  kaart.appendChild(knop);
}

function toonUitnodiging(token) {
  inhoud.innerHTML = '';
  const kaart = el('div', {className: 'kaart'}); inhoud.appendChild(kaart);
  kaart.appendChild(el('h2', {}, 'Beheerder worden — wachtwoord instellen'));
  kaart.appendChild(el('p', {className: 'sub'}, 'Stel een wachtwoord in om mee te beheren.'));
  kaart.appendChild(veld('Wachtwoord (min. 8 tekens)', 'w', 'password'));
  const knop = el('button', {}, 'Opslaan en inloggen');
  knop.onclick = async () => {
    try {
      await post('/api/admin/medebeheerder-instellen', {token, wachtwoord: val('w')});
      toon('ok', 'Klaar! Je kunt nu inloggen met je e-mailadres en dit wachtwoord.');
      history.replaceState({}, '', '/admin');
      toonLogin();
    } catch (f) { toon('fout', f.message); }
  };
  kaart.appendChild(knop);
}

function toonDashboard(mij) {
  inhoud.innerHTML = '';
  AfterSermonI18n.set(mij.admin_taal || 'auto');
  document.getElementById('onderschrift').textContent =
    `Ingelogd als ${mij.email}${mij.naam ? ' · ' + mij.naam : ''}`;

  const basisPane = el('section', {className: 'tab-pane', id: 'tab-basis'});
  const ledenPane = el('section', {className: 'tab-pane', id: 'tab-leden'});
  const berichtenPane = el('section', {className: 'tab-pane actief', id: 'tab-berichten'});
  const analysePane = el('section', {className: 'tab-pane', id: 'tab-analyse'});
  inhoud.append(basisPane, ledenPane, berichtenPane, analysePane);

  const T = s => AfterSermonI18n.text(s);
  analysePane.appendChild(el('div',{className:'kaart',id:'analyse-kaart'},T('Laden…')));
  window._analysePane = analysePane;

  // (Het hoofdscherm — 'Aan de slag' + preek aanleveren + de 4 knoppen — wordt
  //  onderaan gebouwd door bouwHoofdscherm.)

  const kaart = el('div', {className: 'kaart wide'});
  kaart.appendChild(el('div',{className:'eyebrow'},'Overzicht'));
  kaart.appendChild(el('h2', {}, 'Kanaal'));
  kaart.appendChild(el('p', {className: 'sub'},
    'De YouTube- of Kerkdienstgemist-link waar je preken vandaan komen.'));
  kaart.appendChild(veld('Kanaal-URL', 'kanaal', 'text', mij.kanaal_url || ''));

  kaart.appendChild(el('label', {}, 'Tijdzone (waar de diensten gehouden worden)'));
  const tz = el('select', {id: 'tz'});
  ['Europe/Amsterdam','Africa/Johannesburg','Europe/London','America/New_York','America/Chicago','Australia/Sydney']
    .forEach(z => tz.appendChild(el('option', {value: z}, z)));
  tz.value = mij.tijdzone || 'Europe/Amsterdam';
  kaart.appendChild(tz);

  const rij0 = el('div', {className: 'rij'}); rij0.style.marginTop = '.9rem';
  const chk0 = el('input', {id: 'autoverwerk', type: 'checkbox', checked: !!mij.auto_verwerken});
  rij0.append(chk0, el('label', {htmlFor: 'autoverwerk'},
    T('Preken automatisch op de achtergrond verwerken (dan staan de preken van afgelopen zondag klaar als je inlogt)')));
  kaart.appendChild(rij0);

  const rij = el('div', {className: 'rij'}); rij.style.marginTop = '.5rem';
  const chk = el('input', {id: 'auto', type: 'checkbox', checked: !!mij.auto_versturen});
  rij.append(chk, el('label', {htmlFor: 'auto'},
    'Automatisch versturen (uit = eerst zelf goedkeuren via de mail die je krijgt)'));
  kaart.appendChild(rij);

  const rij2 = el('div', {className: 'rij'}); rij2.style.marginTop = '.5rem';
  const chk2 = el('input', {id: 'zonder', type: 'checkbox', checked: !!mij.versturen_zonder_goedkeuring});
  rij2.append(chk2, el('label', {htmlFor: 'zonder'},
    'Tóch versturen als goedkeuring op tijd uitblijft'));
  kaart.appendChild(rij2);

  const rij3 = el('div', {className: 'rij'}); rij3.style.marginTop = '.5rem';
  const chk3 = el('input', {id: 'aidiscl', type: 'checkbox', checked: mij.ai_disclaimer !== false});
  rij3.append(chk3, el('label', {htmlFor: 'aidiscl'},
    'Onderaan elke mail vermelden dat de tekst met AI is gemaakt (aanbevolen)'));
  kaart.appendChild(rij3);

  const knop = el('button', {}, 'Instellingen opslaan');
  knop.onclick = async () => {
    try {
      const kanaalUrl = val('kanaal');
      await post('/api/admin/kanaal', {
        kanaal_url: kanaalUrl, tijdzone: val('tz'),
        auto_versturen: document.getElementById('auto').checked,
        auto_verwerken: document.getElementById('autoverwerk').checked,
        versturen_zonder_goedkeuring: document.getElementById('zonder').checked,
        ai_disclaimer: document.getElementById('aidiscl').checked,
        admin_taal: val('admin_taal'), inschrijf_taal: val('inschrijf_taal'),
        communicatie_taal: val('communicatie_taal'),
        citaat_volledig: document.getElementById('citaat_volledig').value !== 'ref',
        bijbelvertaling: val('bijbelvertaling'),
        accentkleur: val('accentkleur'),
        toon: val('toon'), lengte: val('lengte'),
      });
      if (mij) {
        mij.accentkleur = val('accentkleur'); mij.toon = val('toon'); mij.lengte = val('lengte');
      }
      mij.kanaal_url = kanaalUrl;
      mij.auto_verwerken = document.getElementById('autoverwerk').checked;
      toon('ok', T('Instellingen opgeslagen.'));
    } catch (f) { toon('fout', f.message); }
  };
  kaart.appendChild(knop);
  const talen = el('div');
  talen.appendChild(el('h2',{},'Talen'));
  function taalSelect(label,id,value,auto=true) {
    talen.appendChild(el('label',{htmlFor:id},label));
    const s=el('select',{id});
    if(auto) s.appendChild(el('option',{value:'auto'},'Automatisch (browsertaal)'));
    [['nl','🇳🇱 Nederlands'],['en','🇬🇧 English'],['af','🇿🇦 Afrikaans']]
      .forEach(x=>s.appendChild(el('option',{value:x[0]},x[1])));
    s.value=value || (auto?'auto':'nl'); talen.appendChild(s);
  }
  taalSelect('Taal beheeromgeving','admin_taal',mij.admin_taal);
  taalSelect('Taal inschrijfpagina','inschrijf_taal',mij.inschrijf_taal);
  taalSelect('Taal communicatie','communicatie_taal',mij.communicatie_taal,false);
  kaart.insertBefore(talen, knop);

  const bijbel = el('div');
  bijbel.appendChild(el('h2', {}, T('Bijbeltekst')));
  bijbel.appendChild(el('p', {className: 'sub'},
    T('Kies of het dagstukje de volledige verstekst toont of alleen de verwijzing, en uit welke vertaling. Er wordt altijd hoogstens één vers getoond, met bronvermelding.')));
  bijbel.appendChild(el('label', {htmlFor: 'citaat_volledig'}, T('Weergave van de Bijbeltekst')));
  const cv = el('select', {id: 'citaat_volledig'});
  cv.appendChild(el('option', {value: 'vol'}, T('Volledige verstekst tonen')));
  cv.appendChild(el('option', {value: 'ref'}, T('Alleen de verwijzing tonen')));
  cv.value = (mij.citaat_volledig === false) ? 'ref' : 'vol';
  bijbel.appendChild(cv);
  bijbel.appendChild(el('label', {htmlFor: 'bijbelvertaling'}, T('Vertaling')));
  const bv = el('select', {id: 'bijbelvertaling'});
  bv.appendChild(el('option', {value: 'vrij'}, T('Automatisch (publiek domein)')));
  [['🇳🇱 Nederlands', [['nbv21', 'NBV21'], ['hsv', 'Herziene Statenvertaling (HSV)'], ['bgt', 'Bijbel in Gewone Taal (BGT)']]],
   ['🇿🇦 Afrikaans', [['afr1953', 'Afrikaans 1953']]],
   ['🇬🇧 English', [['kjv', 'King James Version (KJV)'], ['esv', 'English Standard Version (ESV)'], ['niv', 'New International Version (NIV)']]]]
    .forEach(g => {
      const og = el('optgroup', {label: g[0]});
      g[1].forEach(o => og.appendChild(el('option', {value: o[0]}, o[1])));
      bv.appendChild(og);
    });
  bv.value = mij.bijbelvertaling || 'vrij';
  bijbel.appendChild(bv);
  kaart.insertBefore(bijbel, knop);

  const kleur = el('div');
  kleur.appendChild(el('h2', {}, T('Kleur')));
  kleur.appendChild(el('p', {className: 'sub'},
    T('Kies de accentkleur voor je mails en de inschrijfpagina.')));
  kleur.appendChild(el('label', {htmlFor: 'accentkleur'}, T('Accentkleur')));
  const kl = el('input', {id: 'accentkleur', type: 'color', value: mij.accentkleur || '#2c5f2d'});
  kl.style.cssText = 'width:3rem;height:2.2rem;padding:.1rem;vertical-align:middle';
  kleur.appendChild(kl);
  const swatches = el('span'); swatches.style.marginLeft = '.6rem';
  ['#2c5f2d', '#167455', '#1d4ed8', '#7c3aed', '#b91c1c', '#b45309', '#0f766e', '#334155']
    .forEach(c => {
      const s = el('button', {type: 'button', title: c});
      s.style.cssText = 'width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid #0002;' +
        'margin:0 .2rem;padding:0;cursor:pointer;background:' + c;
      s.onclick = () => { kl.value = c; };
      swatches.appendChild(s);
    });
  kleur.appendChild(swatches);
  kaart.insertBefore(kleur, knop);

  const stijl = el('div');
  stijl.appendChild(el('h2', {}, T('Stijl van de overdenkingen')));
  stijl.appendChild(el('p', {className: 'sub'},
    T('Bepaal de toon en de lengte van de overdenkingen die de AI schrijft.')));
  stijl.appendChild(el('label', {htmlFor: 'toon'}, T('Toon')));
  const tn = el('select', {id: 'toon'});
  [['warm', T('Warm en pastoraal')], ['nuchter', T('Nuchter en bijbelgetrouw')],
   ['toegankelijk', T('Eigentijds en toegankelijk')], ['verdiepend', T('Theologisch verdiepend')]]
    .forEach(o => tn.appendChild(el('option', {value: o[0]}, o[1])));
  tn.value = mij.toon || 'warm'; stijl.appendChild(tn);
  stijl.appendChild(el('label', {htmlFor: 'lengte'}, T('Lengte')));
  const ln = el('select', {id: 'lengte'});
  [['kort', T('Kort')], ['middel', T('Gemiddeld')], ['lang', T('Uitgebreid')]]
    .forEach(o => ln.appendChild(el('option', {value: o[0]}, o[1])));
  ln.value = mij.lengte || 'middel'; stijl.appendChild(ln);

  kaart.insertBefore(stijl, knop);

  basisPane.appendChild(kaart);
  document.getElementById('kanaal').addEventListener('change', () => knop.click());

  // --- Logo van de kerk ---
  const logoKaart = el('div', {className: 'kaart'});
  logoKaart.appendChild(el('h2', {}, T('Logo')));
  logoKaart.appendChild(el('p', {className: 'sub'},
    T('Upload het logo van je kerk. Het verschijnt bovenaan de mails en op de inschrijfpagina. PNG, JPG, WEBP, GIF of SVG, maximaal 500 kB.')));
  const logoPrev = el('img', {id: 'logoPrev'});
  logoPrev.style.cssText = 'max-height:64px;max-width:220px;display:none;margin:.4rem 0';
  logoKaart.appendChild(logoPrev);
  const logoRemove = el('button', {}, T('Logo verwijderen'));
  logoRemove.style.cssText = 'margin-left:.5rem;background:#8a8a80';
  function toonLogo() {
    if (mij.heeft_logo) {
      logoPrev.src = '/logo/' + mij.id + '?t=' + Date.now();
      logoPrev.style.display = 'block'; logoRemove.style.display = '';
    } else {
      logoPrev.style.display = 'none'; logoRemove.style.display = 'none';
    }
  }
  const logoIn = el('input', {id: 'logofile', type: 'file',
    accept: 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml'});
  logoKaart.appendChild(logoIn);
  const logoKnop = el('button', {}, T('Logo opslaan'));
  logoKnop.onclick = async () => {
    const f = logoIn.files[0];
    if (!f) { toon('fout', T('Kies eerst een afbeelding.')); return; }
    try {
      const fd = new FormData(); fd.append('file', f);
      const r = await fetch('/api/admin/logo', {method: 'POST', body: fd});
      if (!r.ok) throw new Error(await fouttekst(r, T('Uploaden mislukt.')));
      mij.heeft_logo = true; toonLogo(); toon('ok', T('Logo opgeslagen.'));
    } catch (er) { toon('fout', er.message); }
  };
  logoKaart.appendChild(logoKnop);
  logoRemove.onclick = async () => {
    try {
      const r = await fetch('/api/admin/logo', {method: 'DELETE'});
      if (!r.ok) throw new Error();
      mij.heeft_logo = false; toonLogo(); toon('ok', T('Logo verwijderd.'));
    } catch (er) { toon('fout', T('Verwijderen mislukt.')); }
  };
  logoKaart.appendChild(logoRemove);
  toonLogo();
  basisPane.appendChild(logoKaart);

  // --- Eigen preek uploaden ---
  const up = el('div', {className: 'kaart'});
  up.appendChild(el('h2', {}, 'Eigen preek uploaden'));
  up.appendChild(el('p', {className: 'sub'},
    'Staat een dienst niet in de lijst, of wil je liever je eigen preek gebruiken? ' +
    'Upload hem als document (PDF, DOCX, TXT) of als audio (MP3) — dan wordt daar direct ' +
    'een weekboekje van gemaakt. (Per dienst hierboven kan het ook.)'));
  up.appendChild(el('p', {className: 'sub'},
    'Let op: sommige platforms (zoals SermonAudio) staan automatisch ophalen niet toe ' +
    'volgens hun voorwaarden. Download je preek daar dan zelf en upload hem hier als ' +
    'document of audio — dat mag wél.'));
  const fileIn = el('input', {id: 'upfile', type: 'file', accept: '.pdf,.docx,.txt,.mp3,.m4a,.wav,.ogg'});
  up.appendChild(fileIn);
  up.appendChild(el('label', {}, 'Datum van de dienst (optioneel)'));
  up.appendChild(el('input', {id: 'updatum', type: 'date'}));
  const upknop = el('button', {}, 'Verwerk upload');
  upknop.onclick = async () => {
    const f = fileIn.files[0];
    if (!f) { toon('fout', 'Kies eerst een bestand.'); return; }
    upknop.disabled = true; upknop.textContent = 'Bezig met verwerken… (enkele minuten)';
    try {
      const fd = new FormData();
      fd.append('file', f); fd.append('datum', document.getElementById('updatum').value || '');
      const r = await fetch('/api/admin/upload', {method: 'POST', body: fd});
      if (!r.ok) throw new Error(await fouttekst(r, 'Uploaden mislukt.'));
      const d = await r.json();
      location.href = d.bewerk_url;
    } catch (er) { toon('fout', er.message); upknop.disabled = false; upknop.textContent = 'Verwerk upload'; }
  };
  up.appendChild(upknop);
  // (staat in de Berichten-tab, zie onder)

  // --- Testverzending (Berichten-tab) ---
  const testk = el('div', {className: 'kaart'});
  testk.appendChild(el('h2', {}, 'Testverzending'));
  testk.appendChild(el('p', {className: 'sub'},
    'Stuur de nieuwste verwerkte overdenking als test naar je eigen e-mailadres — zo zie je precies wat je gemeenteleden ontvangen voordat het echt uitgaat.'));
  const testknop = el('button', {}, 'Stuur testmail naar mezelf');
  testknop.onclick = async () => {
    try { const d = await post('/api/admin/test-verzenden', {}); toon('ok', 'Testmail verstuurd naar ' + d.naar + '.'); }
    catch (f) { toon('fout', f.message); }
  };
  testk.appendChild(testknop);

  // --- Medebeheerders (Verzendlijst/overzicht) ---
  const bh = el('div', {className: 'kaart'});
  bh.appendChild(el('h2', {}, T('Beheerders')));
  bh.appendChild(el('p', {className: 'sub'}, T('Nodig extra mensen uit om deze kerk mee te beheren. Zij krijgen een e-mail om een eigen wachtwoord in te stellen.')));
  const bhLijst = el('div', {id: 'bhlijst'}); bh.appendChild(bhLijst);
  bh.appendChild(veld(T('E-mailadres uitnodigen'), 'bh_email', 'email'));
  const bhknop = el('button', {}, T('Uitnodigen'));
  bhknop.onclick = async () => {
    try {
      await post('/api/admin/medebeheerders', {email: val('bh_email')});
      document.getElementById('bh_email').value = '';
      toon('ok', T('Uitnodiging verstuurd.')); laadBeheerders();
    } catch (f) { toon('fout', f.message); }
  };
  bh.appendChild(bhknop);
  ledenPane.appendChild(bh);
  laadBeheerders();

  // (Het oude 'Berichten / Overdenkingen beheren'-blok is vervangen door het

  const instelPane = el('section', {className: 'tab-pane', id: 'tab-instel'});
  const subnav = el('div', {className: 'subtabs'});

  const subpanes = [];
  function subtab(label, nodes) {
    const p = el('div'); p.style.marginTop = '.6rem';

    nodes.forEach(n => { if (n) p.appendChild(n); });
    const b = el('button', {type: 'button', className: subpanes.length ? '' : 'actief'}, label);
    b.onclick = () => {
      subpanes.forEach(x => x.classList.add('weg')); p.classList.remove('weg');
      [...subnav.children].forEach(x => x.classList.toggle('actief', x === b));
    };
    subnav.appendChild(b); subpanes.push(p); instelPane.appendChild(p);
  }
  subtab(T('Verzending'), [kaart]);

  subtab(T('Bijbel en stijl'), [bijbel, stijl]);

  // ---- Geplande taken ----
  const takenContainer = el('div');
  const takenKaart = el('div', {className: 'kaart'});

  const takenLijst = el('div');

  async function laadTaken() {
    takenLijst.innerHTML = '<p style="color:var(--muted);font-size:.9rem">Laden…</p>';
    let taken = [];
    try {
      const r = await fetch('/api/admin/uitzendingen');
      if (!r.ok) throw new Error();
      taken = await r.json();
    } catch { takenLijst.innerHTML = '<p style="color:var(--rood)">Kon taken niet laden.</p>'; return; }

    // Toon alleen diensten die nog niet verstuurd zijn (verzonden == 0)
    const actief = taken.filter(u => u.verzonden === 0);
    if (!actief.length) {
      takenLijst.innerHTML = '<p style="color:var(--muted);font-size:.9rem">Geen geplande taken.</p>';
      return;
    }
    takenLijst.innerHTML = '';

      titel.style.cssText = 'font-weight:600;font-size:.95rem;margin-bottom:.15rem';
      titel.textContent = u.titel || u.video_id;
      const meta = el('div');
      meta.style.cssText = 'font-size:.82rem;color:var(--muted)';
      meta.textContent = u.datum;
      const chip = el('span');
      chip.style.cssText = `display:inline-block;margin-top:.2rem;font-size:.75rem;padding:.1rem .45rem;border-radius:999px;background:color-mix(in srgb,${statusKleur} 14%,transparent);color:${statusKleur};border:1px solid color-mix(in srgb,${statusKleur} 30%,transparent)`;
      chip.textContent = statusTekst;
      info.append(titel, meta, chip);

      const acties = el('div'); acties.style.cssText = 'display:flex;gap:.35rem;flex-shrink:0;margin-top:.1rem';

      if (u.goedgekeurd) {
        const pauzeerK = el('button', {}, 'Pauzeer');
        pauzeerK.style.cssText = 'font-size:.8rem;padding:.25rem .6rem';
        pauzeerK.onclick = async () => {
          if (!confirm(`Goedkeuring van "${u.titel || u.video_id}" intrekken?`)) return;
          try {
            await post(`/api/admin/uitzendingen/${u.video_id}/pauzeer`, {});
            laadTaken();
          } catch (f) { toon('fout', f.message); }
        };
        acties.appendChild(pauzeerK);
      }

      const verwijderK = el('button', {}, 'Verwijder');
      verwijderK.style.cssText = 'font-size:.8rem;padding:.25rem .6rem;background:var(--rood,#c0392b);border-color:transparent;color:#fff';
      verwijderK.onclick = async () => {
        if (!confirm(`"${u.titel || u.video_id}" volledig verwijderen (inclusief transcript)?`)) return;
        try {
          await fetch(`/api/admin/uitzendingen/${u.video_id}`, {method: 'DELETE'});
          laadTaken();
        } catch { toon('fout', 'Verwijderen mislukt.'); }

      acties.appendChild(verwijderK);

      rij.append(info, acties);
      takenLijst.appendChild(rij);

  subtab(T('Geplande taken'), [takenContainer]);
  // Taken laden wanneer de tab actief wordt.
  subnav.lastElementChild.addEventListener('click', laadTaken);
  // Eén opslaan-knop onderaan; leest alle velden, ook uit verborgen sub-tabs.
  const opslaanBalk = el('div'); opslaanBalk.style.marginTop = '1rem';
  opslaanBalk.appendChild(knop);
  instelPane.appendChild(opslaanBalk);

  const panesNew = [berichtenPane, instelPane, analysePane];
  const ICOON_SVG = {
    home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>',
    analyse: '<path d="M4 20h16"/><rect x="5" y="12" width="3.2" height="6" rx="1"/><rect x="10.4" y="8" width="3.2" height="10" rx="1"/><rect x="15.8" y="5" width="3.2" height="13" rx="1"/>',
    instel: '<line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.3"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.3"/>',
  };
  const mkIcon = (naam, titel) => {
    const b = el('button', {type: 'button', title: titel, ariaLabel: titel});
    b.className = 'icoonknop';
    b.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICOON_SVG[naam] + '</svg>';
    return b;
  };
  const homeBtn = mkIcon('home', T('Overzicht'));
  const analyseBtn = mkIcon('analyse', T('Analyse'));
  const instelBtn = mkIcon('instel', T('Instellingen'));
  function toonHoofd(id, actiefBtn) {
    panesNew.forEach(p => p.classList.toggle('actief', p.id === id));
    [homeBtn, analyseBtn, instelBtn].forEach(b => b.classList.toggle('actief', b === actiefBtn));
  }
  homeBtn.onclick = () => toonHoofd('tab-berichten', homeBtn);
  analyseBtn.onclick = () => { toonHoofd('tab-analyse', analyseBtn); laadAnalyse(); };
  instelBtn.onclick = () => toonHoofd('tab-instel', instelBtn);
  // Snelkoppeling vanaf het hoofdscherm naar de verzendlijst-tab (5e sub-tab).
  window._naarVerzendlijst = () => { instelBtn.onclick(); if (subnav.children[4]) subnav.children[4].click(); };
  const iconbalk = el('div', {className: 'icoonbalk'});
  iconbalk.append(homeBtn, analyseBtn, instelBtn);

  basisPane.remove(); ledenPane.remove();
  berichtenPane.classList.add('actief');
  inhoud.insertBefore(iconbalk, berichtenPane);
  inhoud.appendChild(instelPane);
  toonHoofd('tab-berichten', homeBtn);
  bouwHoofdscherm(mij, berichtenPane);

  const uit = el('button', {className: 'link'}, 'Uitloggen');
  uit.onclick = async () => { await post('/api/admin/logout'); location.href = '/'; };
  inhoud.appendChild(uit);
}

// =====================================================================
//  Hoofdscherm
//  - Eerste bezoek (geen kanaal_url): eenmalige intake-wizard (5 stappen)
//  - Terugkerend bezoek (kanaal_url ingesteld): preek-overzicht direct
// =====================================================================
function bouwHoofdscherm(mij, pane) {
  pane.innerHTML = '';
  if ((mij.kanaal_url || '').trim()) {
    bouwPrekenOverzicht(mij, pane);
  } else {
    bouwWizardNieuw(mij, pane);
  }
}

// ---- Eenmalige intake-wizard (eerste bezoek) ----
function bouwWizardNieuw(mij, pane) {
  const T = s => AfterSermonI18n.text(s);
  const st = {videoId: null, heeftPreek: false, enkeleUrl: '', mij};

  const intro = el('div');
  intro.style.cssText = 'background:var(--soft);border-left:4px solid var(--brand);border-radius:.4rem;padding:.8rem 1rem;margin-bottom:1rem';
  intro.appendChild(el('p', {}, T('Stel AfterSermon één keer in. Daarna verloopt alles automatisch: preek ophalen, verwerken en elke week bezorgen aan je gemeenteleden.')));
  pane.appendChild(intro);

  const s1 = stapKaart(1, (mij.aanlevermodus === 'handmatig') ? T('Preek aanleveren') : T('Kanaal aanleveren'));
  const s2 = stapKaart(2, T('Bijbelvertaling'));
  const s3 = stapKaart(3, T('Logo en kleur'));
  const s4 = stapKaart(4, T('Controleur'));
  const s5 = stapKaart(5, T('Gemeenteleden uitnodigen'));
  const stappen = [s1, s2, s3, s4, s5];
  stappen.forEach(s => pane.appendChild(s.kaart));

  const wiz = {
    naar(i) { stappen.forEach((s, idx) => { s.body.hidden = idx !== i; }); },
    voltooi(i, tekst) { stappen[i].merkGroen(tekst); if (i + 1 < stappen.length) this.naar(i + 1); },
  };
  stappen.forEach((s, idx) => { s.kop.onclick = () => wiz.naar(idx); });

  // Stap 1: kanaal of preek aanleveren
  bouwStap1(mij, s1, st, wiz);

  // Stap 2: bijbelvertaling
  s2.body.appendChild(el('p', {className: 'sub'}, T('Kies de bijbelvertaling die je kerk gebruikt.')));
  const bv2 = el('select'); bv2.style.margin = '.3rem 0';
  bv2.appendChild(el('option', {value: 'vrij'}, T('Automatisch (publiek domein)')));
  [['🇳🇱 Nederlands', [['nbv21', 'NBV21'], ['hsv', 'Herziene Statenvertaling (HSV)'], ['bgt', 'Bijbel in Gewone Taal (BGT)']]],
   ['🇿🇦 Afrikaans', [['afr1953', 'Afrikaans 1953']]],
   ['🇬🇧 English', [['kjv', 'King James Version (KJV)'], ['esv', 'English Standard Version (ESV)'], ['niv', 'New International Version (NIV)']]]]
    .forEach(g => { const og = el('optgroup', {label: g[0]}); g[1].forEach(o => og.appendChild(el('option', {value: o[0]}, o[1]))); bv2.appendChild(og); });
  bv2.value = mij.bijbelvertaling || 'vrij';
  s2.body.appendChild(bv2);
  const bv2Knop = el('button', {}, T('Opslaan en verder')); bv2Knop.style.marginTop = '.8rem';
  bv2Knop.onclick = async () => {
    bv2Knop.disabled = true;
    try {
      await bewaarInstellingen(mij, {bijbelvertaling: bv2.value});
      const lbl = bv2.options[bv2.selectedIndex]; wiz.voltooi(1, lbl ? lbl.text : bv2.value);
    } catch(e) { toon('fout', e.message); } finally { bv2Knop.disabled = false; }
  };
  s2.body.appendChild(bv2Knop);
  if (mij.bijbelvertaling) { const lbl = bv2.options[bv2.selectedIndex]; s2.merkGroen(lbl ? lbl.text : mij.bijbelvertaling); }

  // Stap 3: logo + kleur
  s3.body.appendChild(el('p', {className: 'sub'}, T('Kies de accentkleur voor je mails en pagina\'s, en upload je kerklogo (optioneel).')));
  const kleurRij3 = el('div'); kleurRij3.style.cssText = 'display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin:.3rem 0 .8rem';
  const kleur3 = el('input', {type: 'color', value: mij.accentkleur || '#2c5f2d'});
  kleur3.style.cssText = 'width:3rem;height:2.4rem;border:1px solid var(--rand);border-radius:.4rem;background:none';
  kleurRij3.append(el('span', {className: 'sub'}, T('Accentkleur')), kleur3);
  s3.body.appendChild(kleurRij3);
  s3.body.appendChild(_logoRegel(mij));
  const kleurKnop3 = el('button', {}, T('Opslaan en verder')); kleurKnop3.style.cssText = 'display:block;margin-top:1rem';
  kleurKnop3.onclick = async () => {
    kleurKnop3.disabled = true;
    try {
      await bewaarInstellingen(mij, {accentkleur: kleur3.value});
      wiz.voltooi(2, T('Kleur ingesteld'));
    } catch(e) { toon('fout', e.message); } finally { kleurKnop3.disabled = false; }
  };
  s3.body.appendChild(kleurKnop3);

  // Stap 4: controleur
  s4.body.appendChild(el('p', {className: 'sub'}, T('Wie controleert de gegenereerde teksten? Je kunt dit ook overslaan en volledig automatisch laten gaan.')));
  const uitleg4 = el('div');
  uitleg4.style.cssText = 'background:var(--soft);border-left:3px solid var(--brand);border-radius:.4rem;padding:.7rem 1rem;margin:.5rem 0 .8rem;font-size:.9rem';
  uitleg4.innerHTML = '<strong>🤖 ' + T('AfterSermon gebruikt AI') + '</strong><br>' +
    T('De kwaliteit is goed genoeg om direct te versturen. Kies "volledig automatisch" en de AI doet het werk.');
  s4.body.appendChild(uitleg4);
  const controle4 = el('select');
  controle4.appendChild(el('option', {value: 'nee'}, '✅ ' + T('Volledig automatisch (aanbevolen)')));
  controle4.appendChild(el('option', {value: 'ja'}, T('Ik wil elke week eerst goedkeuren')));
  controle4.value = (mij.auto_versturen === false && mij.controle_voor_verzending) ? 'ja' : 'nee';
  s4.body.appendChild(controle4);
  const emailBlok4 = el('div'); emailBlok4.style.cssText = 'margin-top:.6rem;padding:.7rem 1rem;background:var(--soft);border-radius:.4rem';
  emailBlok4.appendChild(el('label', {}, T('Stuur de goedkeuringsmail naar:')));
  const emailInp4 = el('input', {type: 'email', placeholder: mij.email || 'controleur@kerk.nl', value: mij.controle_emails || ''});
  emailInp4.style.cssText = 'width:100%;margin-top:.3rem';
  emailBlok4.appendChild(emailInp4);
  s4.body.appendChild(emailBlok4);
  const syncEmail4 = () => { emailBlok4.hidden = controle4.value !== 'ja'; };
  controle4.onchange = syncEmail4; syncEmail4();
  const controleKnop4 = el('button', {}, T('Opslaan en verder')); controleKnop4.style.cssText = 'display:block;margin-top:1rem';
  controleKnop4.onclick = async () => {
    controleKnop4.disabled = true;
    const metControle = controle4.value === 'ja';
    try {
      await bewaarInstellingen(mij, {
        controle_voor_verzending: metControle, auto_versturen: !metControle,
        controle_emails: emailInp4.value.trim(), als_niet_gecheckt: 'versturen',
      });
      wiz.voltooi(3, metControle ? T('Met goedkeuring') : T('Volledig automatisch'));
    } catch(e) { toon('fout', e.message); } finally { controleKnop4.disabled = false; }
  };
  s4.body.appendChild(controleKnop4);
  {
    const sam4 = (mij.auto_versturen === false && mij.controle_voor_verzending) ? T('Met goedkeuring') : T('Volledig automatisch');
    s4.merkGroen(sam4);
  }

  // Stap 5: uitnodigen (QR + inschrijflink)
  s5.body.appendChild(el('p', {className: 'sub'}, T('Deel de link of QR-code zodat gemeenteleden zich aanmelden voor het weekboekje.')));
  const linkVeld5 = el('input', {readOnly: true, placeholder: T('Laden…')}); linkVeld5.style.cssText = 'width:100%;margin:.4rem 0';
  s5.body.appendChild(linkVeld5);
  fetch('/api/admin/inschrijflink').then(r => r.json()).then(d => { linkVeld5.value = d.url; }).catch(() => {});
  const qrRij5 = el('div'); qrRij5.style.cssText = 'display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:.5rem 0';
  const qrImg5 = el('img'); qrImg5.src = '/api/admin/qr'; qrImg5.style.cssText = 'width:120px;height:120px;border-radius:.4rem';
  const qrDl5 = el('a', {href: '/api/admin/qr?download=true'}, T('QR downloaden')); qrDl5.className = 'secundair';
  qrDl5.style.cssText = 'text-decoration:none;padding:.5rem 1rem;border-radius:.45rem';
  qrRij5.append(qrImg5, qrDl5); s5.body.appendChild(qrRij5);
  const klaarKnop5 = el('button', {}, '✓ ' + T('Klaar, naar de preken')); klaarKnop5.style.cssText = 'display:block;margin-top:.8rem';
  klaarKnop5.onclick = () => { s5.merkGroen(T('Gedeeld')); bouwPrekenOverzicht(mij, pane); };
  s5.body.appendChild(klaarKnop5);

  wiz.naar(0);
}

// ---- Preken-overzicht (terugkerend bezoek, na intake-wizard) ----
function bouwPrekenOverzicht(mij, pane) {
  const T = s => AfterSermonI18n.text(s);
  pane.innerHTML = '';

  const controleur = (mij.controle_emails || '').trim();
  const intro = el('div');
  intro.style.cssText = 'background:var(--soft);border-left:4px solid var(--brand);border-radius:.4rem;padding:.8rem 1rem;margin-bottom:.6rem';
  intro.appendChild(el('p', {}, T('Kies een preek van afgelopen zondag, stel begin en eindtijd in en klik op Verwerken.') +
    (controleur ? ' ' + T('Als de verwerking klaar is, sturen we een link naar ') + controleur + '.' : '')));
  pane.appendChild(intro);

  const lijstHolder = el('div');
  pane.appendChild(lijstHolder);

  const verwerkHolder = el('div');
  pane.appendChild(verwerkHolder);

  const editorHolder = el('div');
  pane.appendChild(editorHolder);

  const st = {videoId: null, heeftPreek: false, enkeleUrl: '', mij};

  function beginVerwerken() {
    lijstHolder.hidden = true;
    verwerkHolder.innerHTML = '';
    const msg = el('div');
    msg.style.cssText = 'background:var(--soft);border-left:4px solid var(--brand);border-radius:.4rem;padding:.8rem 1rem;margin:.6rem 0';
    const ld = el('p', {className: 'sub'}); ld.innerHTML = '<span class="spinner"></span> ' + T('De preek wordt verwerkt — dit duurt een paar minuten.');
    msg.appendChild(ld);
    if (controleur) {
      msg.appendChild(el('p', {className: 'sub'}, T('Als de verwerking klaar is, sturen we een link naar ') + controleur + '.'));
    }
    verwerkHolder.appendChild(msg);
  }

  function klaar(videoId, heeftPreek) {
    st.videoId = videoId; st.heeftPreek = heeftPreek;
    lijstHolder.hidden = true;
    verwerkHolder.innerHTML = '';
    editorHolder.innerHTML = '';

    const sEdit = _editorKaart(T('Materiaal bewerken'));
    const sStuur = _editorKaart(T('Versturen'));
    editorHolder.append(sEdit.kaart, sStuur.kaart);
    sEdit.open(); sStuur.open();

    vulStap4(mij, st, sEdit, sStuur, {naar() {}, voltooi() {}});

    const nieuwKnop = el('button', {className: 'link'}, T('← Andere preek kiezen'));
    nieuwKnop.style.cssText = 'margin-top:1.2rem;display:block';
    nieuwKnop.onclick = () => bouwPrekenOverzicht(mij, pane);
    editorHolder.appendChild(nieuwKnop);
  }

  hs_recenteKies(lijstHolder, mij.kanaal_url, klaar, beginVerwerken, {naar() {}, voltooi() {}});
}

// Kaart zonder stapnummer — voor de content-editor in het preken-overzicht.
function _editorKaart(titel) {

// Volledige instellingen-body vanuit mij (voorkomt dat een deel-opslag andere
// velden op standaard terugzet), met de wijzigingen erin gemengd.
function _kanaalBody(mij, wijziging) {
  const b = {
    kanaal_url: mij.kanaal_url || '', auto_versturen: !!mij.auto_versturen,
    auto_verwerken: !!mij.auto_verwerken, tijdzone: mij.tijdzone || 'Europe/Amsterdam',
    verzend_dag: +(mij.verzend_dag || 0), verzend_tijd: mij.verzend_tijd || '07:00',
    versturen_zonder_goedkeuring: !!mij.versturen_zonder_goedkeuring,
    ai_disclaimer: mij.ai_disclaimer !== false, admin_taal: mij.admin_taal || 'auto',
    inschrijf_taal: mij.inschrijf_taal || 'auto', communicatie_taal: mij.communicatie_taal || 'nl',
    citaat_volledig: mij.citaat_volledig !== false, bijbelvertaling: mij.bijbelvertaling || 'vrij',
    accentkleur: mij.accentkleur || '#2c5f2d', toon: mij.toon || 'warm', lengte: mij.lengte || 'middel',
    uitvoer_taal: mij.uitvoer_taal || 'auto',
    uitvoer_typen: (mij.uitvoer_typen && mij.uitvoer_typen.length) ? mij.uitvoer_typen : ['dagstukjes'],

    inschrijving_open: mij.inschrijving_open !== false,

async function bewaarInstellingen(mij, wijziging) {

  Object.assign(mij, wijziging);
}

// ---- Stap 1: aanlevermodus kiezen of preek/kanaal aanleveren ----
function bouwStap1(mij, s1, st, wiz) {
  const T = s => AfterSermonI18n.text(s);
  s1.body.innerHTML = '';
  const modus = mij.aanlevermodus || '';

  if (!modus) {
    // ── Nog geen keuze: toon keuzemenu ──────────────────────────────────────
    s1.body.appendChild(el('p', {className: 'sub'},
      T('Kies hoe je AfterSermon wil gebruiken. Je kunt dit later altijd wijzigen via Instellingen.')));

    const opties = el('div'); opties.style.cssText = 'display:flex;gap:1rem;flex-wrap:wrap;margin:.8rem 0';

    function keuzeKaart(ico, titel, uitleg, aanbevolen) {
      const k = el('div'); k.style.cssText = 'flex:1 1 14rem;border:2px solid var(--rand);border-radius:.6rem;padding:1rem;cursor:pointer;transition:border-color .15s';
      if (aanbevolen) k.style.borderColor = 'var(--brand)';
      k.appendChild(el('div', {}, ico + ' ' + titel)).style.cssText = 'font-weight:600;font-size:1.05rem;margin-bottom:.4rem';
      if (aanbevolen) { const badge = el('span', {}, T('Aanbevolen')); badge.style.cssText = 'background:var(--brand);color:#fff;font-size:.75rem;padding:.1rem .5rem;border-radius:.3rem;margin-left:.5rem'; k.firstChild.appendChild(badge); }
      k.appendChild(el('p', {className: 'sub'}, uitleg));
      k.onmouseenter = () => { k.style.borderColor = 'var(--brand)'; };
      k.onmouseleave = () => { k.style.borderColor = aanbevolen ? 'var(--brand)' : 'var(--rand)'; };
      return k;
    }

    const kanaalKaart = keuzeKaart('📡', T('Kanaal koppelen'),
      T('AfterSermon haalt elke week automatisch de preek van je YouTube- of Kerkdienstgemist-kanaal. Volledig hands-off — maar de AI moet de juiste preek selecteren en het audio correct transcriberen.'), true);
    const handmatigKaart = keuzeKaart('📤', T('Wekelijks zelf aanleveren'),
      T('Jij levert elke week de preeklink of een bestand aan. Meer controle: jij bepaalt precies welke preek verwerkt wordt.'), false);

    opties.append(kanaalKaart, handmatigKaart); s1.body.appendChild(opties);

    kanaalKaart.onclick = async () => {
      await bewaarInstellingen(mij, {aanlevermodus: 'kanaal'});
      bouwStap1(mij, s1, st, wiz);
    };
    handmatigKaart.onclick = async () => {
      await bewaarInstellingen(mij, {aanlevermodus: 'handmatig'});
      bouwStap1(mij, s1, st, wiz);
    };
    return;
  }

  if (modus === 'handmatig') {
    // ── Handmatig: preek aanleveren ──────────────────────────────────────────
    s1.body.appendChild(el('p', {className: 'sub'},
      T('Plak de link van een preek — of upload een audio- of tekstbestand.')));

    const linkrij = el('div'); linkrij.style.cssText = 'display:flex;gap:.6rem;margin:.8rem 0 .2rem;flex-wrap:wrap';
    const linkveld = el('input', {placeholder: 'https://…'}); linkveld.style.cssText = 'flex:1 1 18rem';
    const verwerkKnop = el('button', {}, T('Verwerk'));
    linkrij.append(linkveld, verwerkKnop); s1.body.appendChild(linkrij);

    s1.body.appendChild(el('div', {className: 'aanlever-of'}, T('of')));
    const uprij = el('div'); uprij.style.cssText = 'display:flex;gap:.6rem;align-items:center;flex-wrap:wrap';
    const upIn = el('input', {type: 'file', accept: '.pdf,.docx,.txt,.mp3,.m4a,.wav,.ogg'}); upIn.style.cssText = 'flex:1 1 16rem';
    const upKnop = el('button', {className: 'secundair'}, T('Upload'));
    uprij.append(upIn, upKnop); s1.body.appendChild(uprij);

    const status = el('p', {className: 'sub'}); status.style.marginTop = '.8rem'; s1.body.appendChild(status);
    const houder = el('div'); s1.body.appendChild(houder);

    const klaar = (videoId, heeftPreek) => {
      st.videoId = videoId; st.heeftPreek = heeftPreek;
      s1.merkGroen(T('Preek aangeleverd'));
    };
    const beginVerwerken = () => { s1.busy(''); wiz.naar(1); };
    verwerkKnop.onclick = () => stap1Verwerk(mij, st, linkveld.value.trim(), status, houder, klaar, beginVerwerken);
    linkveld.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); verwerkKnop.click(); } });
    upKnop.onclick = () => { if (!upIn.files[0]) { status.textContent = T('Kies eerst een bestand.'); return; } beginVerwerken(); hs_uploadPreek(upIn.files[0], status, klaar, null); };

    wiz.naar(1);  // stap 2 direct openen zodat instellingen zichtbaar zijn
    return;
  }

  // ── Kanaal modus ─────────────────────────────────────────────────────────
  const heeftKanaal = !!(mij.kanaal_url || '').trim();

  s1.body.appendChild(el('p', {className: 'sub'},
    T('Plak de link van je YouTube- of Kerkdienstgemist-kanaal. AfterSermon haalt daarna elke week automatisch de preek op.')));

  const linkrij = el('div'); linkrij.style.cssText = 'display:flex;gap:.6rem;margin:.8rem 0 .2rem;flex-wrap:wrap';
  const linkveld = el('input', {placeholder: 'https://…', value: mij.kanaal_url || ''}); linkveld.style.cssText = 'flex:1 1 18rem';
  const instellenKnop = el('button', {}, heeftKanaal ? T('Wijzig') : T('Instellen'));
  linkrij.append(linkveld, instellenKnop); s1.body.appendChild(linkrij);

  const status = el('p', {className: 'sub'}); status.style.marginTop = '.8rem'; s1.body.appendChild(status);
  const houder = el('div'); s1.body.appendChild(houder);

  if (heeftKanaal) {
    s1.merkGroen(T('Kanaal ingesteld'));
    // Vraag of ze een voorbeeld willen zien
    _toonVoorbeeldVraag(mij, st, houder, wiz);
  }

  instellenKnop.onclick = async () => {
    const url = linkveld.value.trim();
    if (!url) { status.textContent = T('Plak eerst een kanaallink.'); return; }
    status.textContent = T('Link controleren…'); instellenKnop.disabled = true;
    try {
      const k = await fetch('/api/kanaal?url=' + encodeURIComponent(url)).then(r => r.ok ? r.json() : Promise.reject(r));
      if (k.soort === 'lijst') {
        await bewaarInstellingen(mij, {kanaal_url: url, aanlevermodus: 'kanaal'});
        status.textContent = '';
        s1.merkGroen(T('Kanaal ingesteld'));
        instellenKnop.textContent = T('Wijzig');
        houder.innerHTML = '';
        _toonVoorbeeldVraag(mij, st, houder, wiz);
        wiz.naar(1);
      } else {
        // Enkele preek-URL: toon tijdmarkeringen
        st.enkeleUrl = url;
        houder.innerHTML = '';
        hs_toonTijdMarkeringen(k.url || url, k.video_id || null, houder, status, (videoId, heeftPreek) => {
          st.videoId = videoId; st.heeftPreek = heeftPreek;
          s1.merkGroen(T('Preek aangeleverd'));
          wiz.naar(1);
        }, () => { s1.busy(''); wiz.naar(1); });
      }
    } catch (e) {
      let m = T('Kon de link niet lezen.');
      if (e && typeof e.json === 'function') { try { m = await fouttekst(e, m); } catch (_) {} }
      else if (e && e.message) m = e.message;
      status.textContent = m;
    } finally { instellenKnop.disabled = false; }
  };
  linkveld.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); instellenKnop.click(); } });
}

// Optionele "Wil je een voorbeeld zien?"-sectie na het instellen van het kanaal.

  container.innerHTML = '';

  rij.append(ja, nee);
  wrap.appendChild(rij);
  container.appendChild(wrap);

  ja.onclick = () => {

async function stap1Verwerk(mij, st, url, status, houder, klaar, beginVerwerken) {
  const T = s => AfterSermonI18n.text(s);
  if (!url) { status.textContent = T('Plak eerst een link.'); return; }
  houder.innerHTML = ''; status.textContent = T('Link controleren…');
  try {
    const k = await fetch('/api/kanaal?url=' + encodeURIComponent(url)).then(r => r.ok ? r.json() : Promise.reject(r));
    if (k.soort === 'lijst') {
      if ((mij.kanaal_url || '').trim() !== url) { try { await bewaarInstellingen(mij, {kanaal_url: url}); } catch (e) {} }
      const zondag = hs_laatsteZondag();
      let diensten = (k.diensten || []).filter(d => d.datum === zondag);
      let opm = '';
      if (!diensten.length) {
        diensten = (k.diensten || []).filter(d => d.datum && d.datum <= new Date().toISOString().slice(0, 10))
          .sort((a, b) => (b.datum || '').localeCompare(a.datum || '')).slice(0, 6);
        opm = T('Geen dienst van afgelopen zondag gevonden — kies er zelf een.');
      }
      hs_toonDiensten(diensten, status, houder, klaar, beginVerwerken, opm);
      return;
    }
    st.enkeleUrl = url;   // onthouden voor 'automatiseren' bij stap 3
    hs_toonTijdMarkeringen(k.url || url, k.video_id || null, houder, status, klaar, beginVerwerken);
  } catch (e) {
    let m = T('Kon de link niet lezen.');
    if (e && typeof e.json === 'function') { try { m = await fouttekst(e, m); } catch (_) {} }
    else if (e && e.message) m = e.message;
    status.textContent = m;
  }
}

// Recente-preken (afgelopen zondag) met een 'kies deze preek'-knop → stap 4/5.
async function hs_recenteKies(container, kanaalUrl, klaar, beginVerwerken, wiz) {
  const T = s => AfterSermonI18n.text(s);
  container.innerHTML = '';
  const kaart = el('div'); kaart.style.marginTop = '.6rem'; container.appendChild(kaart);
  kaart.appendChild(el('p', {className: 'sub'}, T('Preek(en) van afgelopen zondag — kies er één om mee verder te gaan.')));
  let data;
  try { data = await fetch('/api/admin/recente-preken').then(r => r.json()); }
  catch (e) { kaart.appendChild(el('p', {className: 'sub'}, T('Kon de lijst niet laden.'))); return; }
  if (!data.preken || !data.preken.length) {
    kaart.appendChild(el('p', {className: 'sub'}, T('Nog geen dienst van afgelopen zondag gevonden. Plak hierboven een preek- of kanaal-link.')));
  } else {
    data.preken.forEach(p => {
      const rij = el('div'); rij.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid var(--rand);padding:.7rem 0;flex-wrap:wrap';
      rij.appendChild(el('div', {}, (p.titel || 'Dienst') + (p.datum ? ' · ' + p.datum : '')));
      const st2 = el('span', {className: 'sub'});
      if (p.klaar) {
        const knoppenRij = el('div'); knoppenRij.style.cssText = 'display:flex;gap:.4rem;flex-wrap:wrap';
        const b = el('button', {className: 'secundair'}, T('Kies deze preek'));
        b.onclick = () => { klaar(p.video_id, p.heeft_preek); };
        const opnieuwKnop = el('button', {className: 'secundair', title: T('Verwijder verwerking en verwerk opnieuw')}, '↻');
        opnieuwKnop.style.cssText = 'opacity:.7;min-width:2.2rem;padding:.3rem .6rem';
        opnieuwKnop.onclick = async () => {
          if (!confirm(T('Verwerking verwijderen en opnieuw starten?'))) return;
          opnieuwKnop.disabled = true;
          try {
            await fetch('/api/admin/preek/' + p.video_id, {method: 'DELETE'});
            b.remove(); opnieuwKnop.remove();
            if (beginVerwerken) beginVerwerken();
            hs_startVerwerken(p.url, st2, klaar, null);
          } catch (e) { toon('fout', e.message); opnieuwKnop.disabled = false; }
        };
        knoppenRij.append(b, opnieuwKnop);
        rij.appendChild(knoppenRij);
      } else {
        const b = el('button', {className: 'secundair'}, T('Verwerken'));
        b.onclick = () => { b.remove(); rij.appendChild(st2); hs_toonTijdMarkeringen(p.url, p.video_id || null, rij, st2, klaar, beginVerwerken); };
        rij.appendChild(b);
      }
      kaart.appendChild(rij);
    });
  }
  if (kanaalUrl) {
    const meer = el('button', {className: 'link'}, T('Alle diensten tonen…')); meer.style.marginTop = '.8rem';
    const alle = el('div');
    meer.onclick = async () => {
      meer.disabled = true; meer.textContent = T('Laden…');
      try {
        const k = await fetch('/api/kanaal?url=' + encodeURIComponent(kanaalUrl)).then(r => r.json());
        const diensten = (k.diensten || []).filter(d => !d.gepland);
        if (!diensten.length) alle.appendChild(el('p', {className: 'sub'}, T('Geen diensten gevonden.')));
        diensten.forEach(d => {
          const rij = el('div'); rij.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid var(--rand);padding:.7rem 0;flex-wrap:wrap';
          rij.appendChild(el('div', {}, (d.titel || d.label || 'Dienst') + (d.datum ? ' · ' + d.datum : '')));
          const st2 = el('span', {className: 'sub'});
          const b = el('button', {className: 'secundair'}, T('Verwerken'));
          b.onclick = () => { b.remove(); rij.appendChild(st2); if (beginVerwerken) beginVerwerken(); hs_startVerwerken(d.url, st2, klaar, null); };
          rij.appendChild(b); alle.appendChild(rij);
        });
        meer.remove();
      } catch (e) { meer.disabled = false; meer.textContent = T('Alle diensten tonen…'); }
    };
    kaart.append(meer, alle);
  }
}

// ---- Stap 2: kies welke uitvoer we maken (persistente instelling) ----
function bouwStap2(mij, s2, wiz) {
  const T = s => AfterSermonI18n.text(s);
  s2.body.innerHTML = '';
  s2.body.appendChild(el('p', {className: 'sub'},
    T('Kies wat we van elke preek maken. Er wordt alleen AI gebruikt voor wat je aanvinkt.')));
  const opties = [
    ['dagstukjes', T('Een weekboekje met een stukje per dag — dit versturen we naar je gemeenteleden.')],
    ['preeksamenvatting', T('Een korte samenvatting van de preek.')],
    ['nabespreking', T('Gespreksvragen voor kringen en gezinnen.')],
    ['preektranscript', T('De volledige uitgeschreven preek.')],
  ];
  const gekozen = new Set((mij.uitvoer_typen && mij.uitvoer_typen.length) ? mij.uitvoer_typen : ['dagstukjes']);
  const checks = {};
  const grid = el('div'); grid.style.cssText = 'display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));margin:.6rem 0';
  opties.forEach(([key, uitleg]) => {
    const pil = el('label'); pil.style.cssText = 'display:block;border:1px solid var(--rand);border-radius:.6rem;padding:.7rem .9rem;cursor:pointer';

// Planning van de groepsvragen: elke week (mee) of op vaste datums.
// `sel` = de bezorg-keuze van nabespreking; het paneel toont zich alleen bij 'lijst'.
function _nabesprekingPlanning(mij, sel) {
  const T = s => AfterSermonI18n.text(s);
  const panel = el('div');
  panel.style.cssText = 'margin:.1rem 0 .5rem;padding:.6rem .8rem;border-left:3px solid var(--brand);background:var(--soft);border-radius:.4rem';
  panel.appendChild(el('label', {}, T('Wanneer krijgen de groepen de vragen?')));
  const schema = el('select');
  schema.appendChild(el('option', {value: 'mee'}, T('Elke week, samen met de rest')));
  schema.appendChild(el('option', {value: 'datums'}, T('Op vaste datums')));
  schema.value = mij.nabespreking_schema === 'datums' ? 'datums' : 'mee';
  panel.appendChild(schema);
  const datumBox = el('div'); datumBox.style.marginTop = '.5rem'; panel.appendChild(datumBox);
  const datums = Array.isArray(mij.nabespreking_datums) ? mij.nabespreking_datums.slice() : [];

  function render() {
    datumBox.hidden = schema.value !== 'datums';
    if (schema.value !== 'datums') return;
    datumBox.innerHTML = '';
    datumBox.appendChild(el('p', {className: 'sub'}, T('Voeg de datums toe waarop de groepsvragen worden verstuurd.')));
    const chips = el('div'); chips.style.cssText = 'display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0';
    datums.sort();
    datums.forEach((d, i) => {
      const chip = el('span'); chip.style.cssText = 'display:inline-flex;align-items:center;gap:.35rem;background:var(--kaart);border:1px solid var(--rand);border-radius:.4rem;padding:.2rem .5rem';
      const x = el('button', {className: 'link'}, '✕'); x.style.margin = '0';
      x.onclick = () => { datums.splice(i, 1); render(); };
      chip.append(el('span', {}, d), x); chips.appendChild(chip);
    });
    if (!datums.length) chips.appendChild(el('span', {className: 'sub'}, T('Nog geen datums.')));
    datumBox.appendChild(chips);
    const rij = el('div'); rij.style.cssText = 'display:flex;gap:.4rem;flex-wrap:wrap;align-items:center';
    const inp = el('input', {type: 'date'});
    const add = el('button', {className: 'secundair'}, T('Datum toevoegen'));
    add.onclick = () => { const v = inp.value; if (v && !datums.includes(v)) { datums.push(v); inp.value = ''; render(); } };
    rij.append(inp, add); datumBox.appendChild(rij);
  }
  schema.onchange = render;
  const sync = () => { panel.hidden = sel.value !== 'lijst'; };
  sel.addEventListener('change', sync); sync(); render();
  return {panel, getSchema: () => schema.value, getDatums: () => datums.slice()};
}

// Logo-regel: toon huidig logo (indien aanwezig), upload nieuw, of verwijder.
function _logoRegel(mij) {
  const T = s => AfterSermonI18n.text(s);
  const wrap = el('div'); wrap.style.cssText = 'display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin:.2rem 0 .2rem';

  const upIn = el('input', {type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml'});
  upIn.onchange = async () => {
    if (!upIn.files[0]) return;
    try {
      const fd = new FormData(); fd.append('file', upIn.files[0]);
      const r = await fetch('/api/admin/logo', {method: 'POST', body: fd});

      mij.heeft_logo = true; img.src = '/logo/' + mij.id + '?t=' + Date.now(); img.hidden = false; verw.hidden = false;
      toon('ok', T('Logo opgeslagen.'));

  };
  const verw = el('button', {className: 'grijs'}, T('Logo verwijderen'));
  verw.hidden = !mij.heeft_logo;
  verw.onclick = async () => {
    try {
      const r = await fetch('/api/admin/logo', {method: 'DELETE'});
      if (!r.ok) throw new Error(await fouttekst(r, T('Verwijderen mislukt.')));
      mij.heeft_logo = false; img.hidden = true; verw.hidden = true; upIn.value = '';

  };
  wrap.append(el('span', {className: 'sub'}, T('Logo')), img, upIn, verw);

// Laadt de opgeslagen data (zonder AI) en toont de editor, of een knop om te maken.
async function bouwEditorBlok(mij, st, typ, houder, s5, wiz) {
  const T = s => AfterSermonI18n.text(s);
  houder.innerHTML = ''; houder.appendChild(el('p', {className: 'sub'}, T('Laden…')));
  let d;
  try { d = await fetch('/api/data/' + st.videoId).then(r => r.ok ? r.json() : Promise.reject(r)); }
  catch (e) { houder.innerHTML = ''; houder.appendChild(el('p', {className: 'sub'}, T('Kon niet laden.'))); return; }
  const aanwezig = typ === 'dagstukjes' ? d.heeft_dagen : d.heeft_samenvatting;
  houder.innerHTML = '';
  if (aanwezig) {
    bouwWeekboekjeEditor(mij, st, typ, houder, d.data, s5, wiz);
  } else {
    const wat = typ === 'dagstukjes' ? 'dagstukjes' : 'samenvatting';

      typ === 'dagstukjes' ? T('Maak dagstukjes') : T('Maak samenvatting'));
    knop.onclick = async () => {
      const orig = knop.textContent; knop.disabled = true; knop.textContent = T('Bezig met genereren…');

        const r = await fetch('/api/genereer/' + st.videoId, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({wat})});

  const rij = el('div'); rij.style.cssText = 'display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.6rem';

    }};
    if (dagInputs.length) body.velden.dagen = dagInputs.map(inp => ({

    }));
    const orig = opslaan.textContent; opslaan.disabled = true; opslaan.textContent = T('Bezig…');

    } catch (e) { toon('fout', e.message); opslaan.disabled = false; opslaan.textContent = orig; }
  };
  const dl = el('a', {href: (typ === 'dagstukjes') ? '/api/pdf/' + st.videoId : '/api/pdf/' + st.videoId}, T('Download PDF'));
  dl.className = 'grijs'; dl.style.cssText = 'text-decoration:none;padding:.55rem 1rem;border-radius:.45rem';
  const opnieuw = el('button', {className: 'link'}, '↻ ' + T('Opnieuw genereren'));

    houder.appendChild(bezig);
    try {
      const r = await fetch('/api/genereer/' + st.videoId, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({wat})});
      if (!r.ok) throw new Error(await fouttekst(r, T('Genereren mislukt.')));
      const out = await r.json();
      bouwWeekboekjeEditor(mij, st, typ, houder, out.data, s5, wiz);
    } catch (e) { toon('fout', e.message); bouwEditorBlok(mij, st, typ, houder, s5, wiz); }
  };
  rij.append(opslaan, dl, opnieuw); houder.appendChild(rij);

  // Dagstukjes klaar → stap 5 (versturen) beschikbaar maken.
  if (typ === 'dagstukjes') { vulStap5(mij, st, s5); }

// Datum (YYYY-MM-DD) van de meest recente zondag t/m vandaag (afgelopen zondag).
function hs_laatsteZondag() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());  // getDay(): 0=zondag
  return d.toISOString().slice(0, 10);
}

// Toon YouTube-player met tijdmarkeringen zodat de admin begin/eind van de preek aanwijst.
function hs_toonTijdMarkeringen(url, videoId, houder, status, klaar, beginVerwerken) {
  const T = s => AfterSermonI18n.text(s);
  if (!videoId) {
    const m = (url || '').match(/(?:v=|youtu\.be\/|\/embed\/)([A-Za-z0-9_-]{11})/);
    videoId = m ? m[1] : null;
  }
  houder.innerHTML = '';
  const kaart = el('div', {className: 'kaart'});
  kaart.appendChild(el('h2', {}, T('Wijs de preek aan')));
  kaart.appendChild(el('p', {className: 'sub'},
    T('Speel de video af en druk op "Begin" en "Eind" op het juiste moment. Of typ de tijden handmatig (bijv. 31:20 of 1:05:00).')));

  // YouTube-player
  let ytPlayer = null;
  if (videoId) {
    const wrap = el('div');
    wrap.style.cssText = 'position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;margin-bottom:1.2rem';
    const iframe = el('iframe');
    iframe.id = 'yt-marker-iframe';
    iframe.src = 'https://www.youtube.com/embed/' + videoId + '?enablejsapi=1';
    iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none';
    iframe.allow = 'accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture';
    iframe.allowFullscreen = true;
    wrap.appendChild(iframe);
    kaart.appendChild(wrap);
    const initYT = () => {
      ytPlayer = new YT.Player('yt-marker-iframe', {});
    };
    if (window.YT && window.YT.Player) { initYT(); }
    else {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); initYT(); };
      if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(s);
      }
    }
  }

  // Tijdhelpers
  const secNaarTijd = sec => {
    sec = Math.round(sec || 0);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    return m + ':' + String(s).padStart(2,'0');
  };
  const tijdNaarSec = str => {
    const p = (str || '').trim().split(':').map(Number);
    if (p.length === 3) return p[0]*3600 + p[1]*60 + (p[2]||0);
    if (p.length === 2) return p[0]*60 + (p[1]||0);
    return parseInt(str)||0;
  };
  const huidigeTijd = () => { try { return ytPlayer && ytPlayer.getCurrentTime ? Math.round(ytPlayer.getCurrentTime()) : 0; } catch(_){return 0;} };

  // Preekdelen
  const delenLijst = [];
  const delenDiv = el('div');
  kaart.appendChild(delenDiv);

  const voegDeelToe = (startSec, eindSec) => {
    const idx = delenLijst.length;
    const rij = el('div');
    rij.style.cssText = 'display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.6rem 0;padding:.75rem;background:var(--soft);border-radius:6px';
    const lbl = el('span', {}, (idx === 0 ? T('Preek') : T('Deel') + ' ' + (idx+1)) + ':');
    lbl.style.cssText = 'font-weight:600;min-width:4.5rem';
    const bIn = el('input', {type:'text', placeholder:'31:20', value: startSec ? secNaarTijd(startSec) : ''});
    bIn.style.cssText = 'width:5.5rem;padding:.3rem .5rem;border:1px solid var(--rand);border-radius:4px;font-family:monospace';
    const bKnop = el('button', {className:'secundair', title:T('Huidige afspeelpositie instellen als beginpunt')}, '⏺ ' + T('Begin'));
    bKnop.style.cssText = 'padding:.3rem .65rem;font-size:.82rem';
    bKnop.onclick = () => { bIn.value = secNaarTijd(huidigeTijd()); };
    const pijl = el('span', {}, '→');
    const eIn = el('input', {type:'text', placeholder:'1:20:00', value: eindSec ? secNaarTijd(eindSec) : ''});
    eIn.style.cssText = 'width:5.5rem;padding:.3rem .5rem;border:1px solid var(--rand);border-radius:4px;font-family:monospace';
    const eKnop = el('button', {className:'secundair', title:T('Huidige afspeelpositie instellen als eindpunt')}, '⏹ ' + T('Eind'));
    eKnop.style.cssText = 'padding:.3rem .65rem;font-size:.82rem';
    eKnop.onclick = () => { eIn.value = secNaarTijd(huidigeTijd()); };
    rij.append(lbl, bKnop, bIn, pijl, eKnop, eIn);
    if (idx > 0) {
      const del = el('button', {title:T('Verwijder dit deel')}, '✕');
      del.style.cssText = 'opacity:.55;padding:.3rem .5rem;font-size:.82rem';
      del.onclick = () => { delenDiv.removeChild(rij); delenLijst.splice(delenLijst.indexOf(deel), 1); };
      rij.appendChild(del);
    }
    const deel = {rij, bIn, eIn};
    delenLijst.push(deel);
    delenDiv.appendChild(rij);
  };
  voegDeelToe(0, 0);

  const extraKnop = el('button', {className:'link'}, '+ ' + T('Tweede preekdeel'));
  extraKnop.style.cssText = 'margin-top:.3rem;font-size:.9rem';
  extraKnop.onclick = () => voegDeelToe(0, 0);
  kaart.appendChild(extraKnop);

  const fout = el('p', {className:'sub'}); fout.style.color = 'var(--rood, #c0392b)';
  kaart.appendChild(fout);

  const verwerkKnop = el('button', {}, T('Verwerken →'));
  verwerkKnop.style.cssText = 'margin-top:1rem;display:block';
  verwerkKnop.onclick = async () => {
    const tijden = delenLijst
      .map(d => [tijdNaarSec(d.bIn.value), tijdNaarSec(d.eIn.value)])
      .filter(([s, e]) => e > s && e > 0);
    if (!tijden.length) { fout.textContent = T('Stel minstens één begin- en eindtijd in.'); return; }
    fout.textContent = '';
    houder.innerHTML = '';
    if (beginVerwerken) beginVerwerken();
    await hs_startVerwerken(url, status, klaar, null, tijden);
  };
  kaart.appendChild(verwerkKnop);
  houder.appendChild(kaart);
}

async function hs_startVerwerken(url, status, klaar, aanleverBox, preekTijden) {
  const T = s => AfterSermonI18n.text(s);
  status.textContent = T('Verwerken… (dit kan enkele minuten duren)');
  try {
    const body = {url};
    if (preekTijden && preekTijden.length) body.preek_tijden = preekTijden;
    const r = await fetch('/api/verwerk', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error(await fouttekst(r, T('Verwerken mislukt.')));
    const {taak_id} = await r.json();
    hs_volgTaak(taak_id, status, klaar, aanleverBox);
  } catch (e) { status.textContent = e.message; if (aanleverBox) aanleverBox.hidden = false; }
}

async function hs_volgTaak(taakId, status, klaar, aanleverBox) {
  while (true) {
    await new Promise(r => setTimeout(r, 2500));
    let t;
    try { t = await fetch('/api/status/' + taakId).then(r => r.json()); } catch (e) { continue; }
    if (t.status === 'fout') { status.textContent = t.fout || 'Er ging iets mis.'; if (aanleverBox) aanleverBox.hidden = false; return; }
    if (t.status === 'klaar') { klaar(t.resultaat.video_id, t.resultaat.heeft_preek); return; }
    if (t.stap) status.textContent = t.stap;
  }
}

async function hs_uploadPreek(file, status, klaar, aanleverBox) {
  const T = s => AfterSermonI18n.text(s);
  if (!file) { status.textContent = T('Kies eerst een bestand.'); return; }
  if (aanleverBox) aanleverBox.hidden = true;
  status.textContent = T('Verwerken… (dit kan enkele minuten duren)');
  try {
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch('/api/admin/upload', {method: 'POST', body: fd});
    if (!r.ok) throw new Error(await fouttekst(r, T('Uploaden mislukt.')));
    const d = await r.json();
    klaar(d.video_id, true);
  } catch (e) { status.textContent = e.message; if (aanleverBox) aanleverBox.hidden = false; }
}

async function hs_genereer(videoId, wat, knop, download) {

async function laadInschrijvers() {
  const lijst = document.getElementById('subs');
  if (!lijst) return;
  const rijen = await fetch('/api/admin/inschrijvers').then(r => r.json()).catch(() => []);

  const stats = document.getElementById('stats');
  if (stats) {
    const totaal = rijen.length;
    const bevestigd = rijen.filter(s => s.bevestigd).length;
    const wekelijks = rijen.filter(s => s.frequentie === 'wekelijks').length;
    const dagelijks = totaal - wekelijks;
    stats.innerHTML =
      `<p style="font-size:1.6rem;margin:.2rem 0;color:var(--groen)"><b>${bevestigd}</b> ` +
      `<span style="font-size:1rem;color:var(--grijs)">bevestigde inschrijvers</span></p>` +
      `<p class="sub">${totaal} totaal · ${totaal - bevestigd} nog te bevestigen · ` +
      `${wekelijks}× wekelijks · ${dagelijks}× dagelijks</p>`;
  }

  lijst.innerHTML = '';
  if (!rijen.length) { lijst.innerHTML = '<p class="sub">Nog geen inschrijvers.</p>'; return; }
  rijen.forEach(s => {
    const r = el('div'); r.style.borderBottom = '1px solid var(--rand)'; r.style.padding = '.5rem 0';
    const kop = el('div', {className: 'rij'}); kop.style.justifyContent = 'space-between';
    kop.appendChild(el('span', {}, `${s.naam || '(geen naam)'} · ${s.email} · ${s.frequentie}` +
      (s.bevestigd ? '' : ' · nog niet bevestigd')));
    const acties = el('span');
    const wijzig = el('button', {className: 'link'}, 'wijzig'); wijzig.style.margin = '0 .8rem 0 0';
    const del = el('button', {className: 'link'}, 'verwijderen'); del.style.color = '#b0201a'; del.style.margin = '0';
    acties.append(wijzig, del); kop.appendChild(acties); r.appendChild(kop);

    del.onclick = async () => {
      if (!confirm('Deze inschrijver verwijderen?')) return;
      await fetch('/api/admin/inschrijvers/' + s.id, {method: 'DELETE'});
      laadInschrijvers();
    };
    wijzig.onclick = () => {
      const form = el('div'); form.style.margin = '.4rem 0';
      const n = el('input', {value: s.naam || ''}); const e = el('input', {value: s.email, type: 'email'});
      const t = el('input', {value: s.telefoon || ''});
      const f = el('select'); f.append(el('option', {value: 'wekelijks'}, 'Wekelijks'), el('option', {value: 'dagelijks'}, 'Dagelijks')); f.value = s.frequentie;
      [n, e, t].forEach(x => x.style.marginBottom = '.3rem');
      const opslaan = el('button', {}, 'Opslaan'); opslaan.style.marginRight = '.5rem';
      opslaan.onclick = async () => {
        try {
          await fetch('/api/admin/inschrijvers/' + s.id, {method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({naam: n.value, email: e.value, telefoon: t.value, frequentie: f.value})});
          laadInschrijvers();
        } catch (er) { toon('fout', 'Wijzigen mislukt.'); }
      };
      form.append(el('label', {}, 'Naam'), n, el('label', {}, 'E-mail'), e,
        el('label', {}, 'Telefoon'), t, el('label', {}, 'Frequentie'), f, opslaan);
      if (r.querySelector('.bewerkform')) { r.querySelector('.bewerkform').remove(); return; }
      form.className = 'bewerkform'; r.appendChild(form);
    };
    lijst.appendChild(r);
  });
}

async function laadBeheerders() {
  const lijst = document.getElementById('bhlijst');
  if (!lijst) return;
  const rijen = await fetch('/api/admin/medebeheerders').then(r => r.json()).catch(() => []);
  lijst.innerHTML = '';
  rijen.forEach(m => {
    const r = el('div', {className: 'rij'}); r.style.justifyContent = 'space-between';
    r.style.borderBottom = '1px solid var(--rand)'; r.style.padding = '.4rem 0';
    r.appendChild(el('span', {}, m.email + (m.actief ? '' : ' · uitnodiging open')));
    const del = el('button', {className: 'link'}, 'verwijderen');
    del.style.color = '#b0201a'; del.style.margin = '0';
    del.onclick = async () => {
      if (!confirm('Deze beheerder verwijderen?')) return;
      await fetch('/api/admin/medebeheerders/' + m.id, {method: 'DELETE'});
      laadBeheerders();
    };
    r.appendChild(del); lijst.appendChild(r);
  });
}

const val = id => document.getElementById(id).value.trim();

// ---- Router op basis van sessie + querystring ----
(async function start() {
  if (params.get('geverifieerd')) toon('ok', 'E-mailadres bevestigd. Je kunt nu inloggen.');
  if (params.get('verify_mislukt')) toon('fout', 'Bevestigingslink ongeldig of verlopen.');
  if (params.get('reset')) { toonReset(params.get('reset')); return; }
  if (params.get('uitnodiging')) { toonUitnodiging(params.get('uitnodiging')); return; }

  const mij = await fetch('/api/admin/mij').then(r => r.json()).catch(() => ({ingelogd: false}));
  if (mij.ingelogd) toonDashboard(mij); else toonLogin();
})();
</script>
